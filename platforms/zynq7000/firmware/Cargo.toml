[package]
name = "shoop_zynq_firmware"
version = "0.3.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib"]

[features]
usb-midi = ["shoop_host_freertos/usb-midi"]
fixture = ["shoop_host_freertos/fixture"]
fpga = ["shoop_host_freertos/fpga"]
fpga-trace = ["fpga", "shoop_host_freertos/fpga-trace"]

[dependencies]
shoop_host_freertos = { path = "../../../src/rust/shoop_host_freertos" }
linked_list_allocator = { version = "=0.10.5", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1


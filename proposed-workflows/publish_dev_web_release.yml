name: Publish Development Web Release

on:
  workflow_run:
    workflows: ["Build and Test ShoopDaLoop"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-development-web-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted publishing code
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Find optimized web application artifact
        id: web-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mapfile -t names < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name' |
              grep -E '^shoopdaloop-web-wasm32-release(-[A-Za-z0-9._-]+)?\.html$'
          )
          if (( ${#names[@]} != 1 )); then
            echo "Expected exactly one optimized standalone web artifact, found ${#names[@]}: ${names[*]}" >&2
            exit 1
          fi
          echo "name=${names[0]}" >> "$GITHUB_OUTPUT"

      - name: Download optimized web application
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.web-artifact.outputs.name }}
          path: ${{ runner.temp }}/self-contained-web-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-decompress: true

      - name: Publish rolling development release
        id: publish
        env:
          ASSET_NAME: shoopdaloop-web-wasm32-development-preview.html
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_ASSET_NAME: shoopdaloop-web-wasm32-release.html
          RELEASE_TAG: dev-web
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/publish-development-web-release.log"
          bash .github/scripts/publish_dev_web_release.sh \
            "${{ runner.temp }}/self-contained-web-preview" | tee "$log"
          if grep -Fq "Published $CANDIDATE_SHA to " "$log"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger website rebuild
        if: steps.publish.outputs.published == 'true'
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.SHOOPDALOOP_WEBSITE_ACTIONS_TOKEN }}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::notice::Website rebuild was not triggered because SHOOPDALOOP_WEBSITE_ACTIONS_TOKEN is not configured"
            exit 0
          fi
          gh workflow run pages.yml \
            --repo SanderVocke/shoopdaloop-website \
            --ref gh-pages \
            --field source_sha="$CANDIDATE_SHA"

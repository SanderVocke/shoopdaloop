[package]
name = "shoop_rt_engine"
version.workspace = true
edition = "2021"
description = "The new engine backend's real-time composition, control endpoint and render owner"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[lints]
workspace = true

[features]
# A deterministic offline host for tests and adapters; no extra dependencies.
testing = []
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
rt_audio_math = { path = "../rt_audio_math" }
rt_profiling = { path = "../rt_profiling" }

profiling_protocol = { path = "../profiling_protocol" }

rt_buffered = { path = "../rt_buffered" }
shoop_rt_transport = { path = "../shoop_rt_transport" }
rt_runtime = { path = "../rt_runtime" }
shoop_loops = { path = "../shoop_loops" }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
shoop_processor_protocol = { path = "../shoop_processor_protocol", features = ["alloc"] }

[dev-dependencies]
shoop_rt_engine = { path = ".", features = ["testing"] }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }
shoop_persistence_codec = { path = "../shoop_persistence_codec" }
shoop_app_protocol = { path = "../shoop_app_protocol" }
shoop_app_api = { path = "../shoop_app_api" }
shoop_session = { path = "../shoop_session" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

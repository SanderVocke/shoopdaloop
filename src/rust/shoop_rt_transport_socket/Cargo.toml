[package]
name = "shoop_rt_transport_socket"
version.workspace = true
edition = "2021"
description = "Authenticated socket endpoints for the common engine record transport"
[lints]
workspace = true
[dependencies]
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
shoop_rt_transport = { path = "../shoop_rt_transport" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
[dev-dependencies]
shoop_rt_transport = { path = "../shoop_rt_transport", features = ["contracts"] }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

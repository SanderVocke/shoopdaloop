[package]
name = "shoop_app_api"
version.workspace = true
edition = "2021"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[features]
default = []
serde = ["dep:serde", "shoop_port_graph/serde", "shoop_processor_protocol/serde"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
rt_profiling = { path = "../rt_profiling" }
shoop_processor_protocol = { path = "../shoop_processor_protocol", features = ["alloc"] }
shoop_port_graph = { path = "../shoop_port_graph" }
serde = { workspace = true, features = ["derive", "rc"], optional = true }
shoop_latency = { path = "../shoop_latency" }
shoop_script_resources = { path = "../shoop_script_resources", default-features = false }

[dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[lints]
workspace = true

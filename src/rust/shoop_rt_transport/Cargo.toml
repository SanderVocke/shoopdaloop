[package]
name = "shoop_rt_transport"
version.workspace = true
edition = "2021"
description = "Portable connections and typed/record carriers for the engine protocol"

[lints]
workspace = true

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[features]
std = []
contracts = ["std"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
shoop_transport = { path = "../shoop_transport" }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }

[dev-dependencies]
shoop_rt_transport = { path = ".", features = ["contracts"] }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

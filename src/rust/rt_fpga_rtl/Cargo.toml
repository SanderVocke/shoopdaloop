[package]
name="rt_fpga_rtl"
version.workspace=true
edition="2024"
description="RTL program encoding and optional Marlin model support"
[lints]
workspace=true
[features]
default=[]
sim=["dep:marlin","dep:quick-xml","dep:sha2","dep:serde_json"]
rt-interface=["dep:rt_fpga_reference","dep:shoop_rt_protocol"]
[dependencies]
rt_fpga_compiler={path="../rt_fpga_compiler"}
rt_fpga_reference={path="../rt_fpga_reference",optional=true}
shoop_rt_protocol={path="../shoop_rt_protocol",optional=true}
serde={workspace=true,features=["derive"]}
serde_json={workspace=true,optional=true}
sha2={workspace=true,optional=true}
[target.'cfg(not(target_arch="wasm32"))'.dependencies]
marlin={version="=0.21.1",features=["verilog"],optional=true}
quick-xml={version="0.41.0",optional=true}
[dev-dependencies]
shoop_wasm_test_support={path="../shoop_wasm_test_support"}

[package]
name = "shoop_egui_preview"
edition = "2021"

[dependencies]
eframe = { workspace = true }
shoop_app_api = { path = "../shoop_app_api" }
shoop_egui = { path = "../shoop_egui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
log = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }

[lints]
workspace = true

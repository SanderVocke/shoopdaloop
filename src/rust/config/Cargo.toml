[package]
name = "config"
edition = "2021"

[[bin]]
name = "print_configs_dir"
path = "src/bin/print_configs_dir.rs"

[dependencies]
common = { path = "../common" }

glob = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
copy_dir = { workspace = true }
log = { workspace = true }
ctor = { workspace = true }
toml = { workspace = true }
# derive is used directly here; do not rely on another crate's feature unifying in
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[build-dependencies]
common = { path = "../common" }

anyhow = { workspace = true }
toml = { workspace = true }
# build.rs pulls in src/config.rs, which derives Serialize/Deserialize
serde = { workspace = true, features = ["derive"] }
log = { workspace = true }
ctor = { workspace = true }

[features]
# Dummy build to build dependencies only
prebuild = ["common/prebuild"]
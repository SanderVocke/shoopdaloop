[package]
name = "shoop_engine"
version.workspace = true
edition = "2021"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[lib]

[[example]]
name = "carla_inprocess_benchmark"
required-features = ["carla"]

[[example]]
name = "carla_bridge_benchmark"
required-features = ["carla"]

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
arc-swap = { workspace = true }
rtrb = { workspace = true }
rubato = { workspace = true }
# Optional so the engine builds and tests without libjack present.
jack = { workspace = true, optional = true }
# Optional too, though cpal needs no system library on macOS or Windows.
cpal = { workspace = true, optional = true }
# MIDI for hosts without JACK. Optional for the same reason.
midir = { workspace = true, optional = true }
base64 = { workspace = true }
serde_json = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
memmap2 = { workspace = true }
tempfile = { workspace = true }
assert_no_alloc = { workspace = true }
shoop_plugin_protocol = { path = "../shoop_plugin_protocol" }
shoop_settings = { path = "../shoop_settings" }
tracing = { workspace = true }
enum-iterator = { workspace = true }
num_enum = { workspace = true }
oxisynth = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
soundfont = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
shoop_tracing = { workspace = true, features = ["tracy"] }
uuid = { workspace = true }
rfd = { workspace = true, default-features = false, features = ["xdg-portal", "async-std"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
shoop_tracing = { workspace = true, default-features = false }

[lints]
workspace = true

[features]
prebuild = []
jack = ["dep:jack"]
cpal = ["dep:cpal"]
midir = ["dep:midir"]
carla = ["dep:serde_json", "dep:libloading", "dep:libc", "dep:rfd"]
native_audio_backend = ["jack", "cpal", "midir"]
app_backend = ["native_audio_backend"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dev-dependencies]
assert2 = { workspace = true }
rtrb = { workspace = true }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tracy-client.workspace = true
tracy-nextest-capture.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[package]
name = "shoop_engine"
edition = "2021"

[lib]

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
rtrb = { workspace = true }
rubato = { workspace = true }
# Optional so the engine builds and tests without libjack present.
jack = { workspace = true, optional = true }
# Optional too, though cpal needs no system library on macOS or Windows.
cpal = { workspace = true, optional = true }
# MIDI for hosts without JACK. Optional for the same reason.
midir = { workspace = true, optional = true }
lilv = { workspace = true, optional = true }
lv2_raw = { workspace = true, optional = true }
assert_no_alloc = { workspace = true }
enum-iterator = { workspace = true }
num_enum = { workspace = true }

[features]
jack = ["dep:jack"]
cpal = ["dep:cpal"]
midir = ["dep:midir"]
lv2 = ["dep:lilv", "dep:lv2_raw"]
app_backend = ["jack", "cpal", "midir", "lv2"]

[dev-dependencies]
assert2 = { workspace = true }
rtrb = { workspace = true }

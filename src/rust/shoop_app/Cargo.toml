[package]
name = "shoop_app"
version.workspace = true
edition = "2021"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[features]
default = ["legacy"]
legacy = ["dep:shoop_scripting", "dep:shoop_session", "dep:shoop_script_resources", "dep:shoop_latency", "dep:midir", "dep:tempfile", "shoop_backend/legacy"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
shoop_app_protocol = { path = "../shoop_app_protocol" }
anyhow = { workspace = true }
shoop_app_api = { path = "../shoop_app_api" }
shoop_backend = { path = "../shoop_backend", default-features = false }
shoop_latency = { path = "../shoop_latency", optional = true }
shoop_session = { path = "../shoop_session", optional = true }
shoop_scripting = { path = "../shoop_scripting", optional = true }
shoop_script_resources = { path = "../shoop_script_resources", optional = true }
tracing = { workspace = true }

[dev-dependencies]
shoop_rt_transport = { path = "../shoop_rt_transport" }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
shoop_transport = { path = "../shoop_transport" }
shoop_backend = { path = "../shoop_backend", features = ["legacy"] }
shoop_app_client = { path = "../shoop_app_client" }
shoop_rt_backend = { path = "../shoop_rt_backend" }
shoop_rt_engine = { path = "../shoop_rt_engine", features = ["testing"] }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[lints]
workspace = true

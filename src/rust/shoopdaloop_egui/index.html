<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181818" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23181818'/%3E%3Cpath d='M75 32A32 32 0 1 0 78 63' fill='none' stroke='%23f0b429' stroke-width='12'/%3E%3Cpath d='M72 13v25H47' fill='none' stroke='%23f0b429' stroke-width='12'/%3E%3C/svg%3E" />
    <title>ShoopDaLoop egui browser audio</title>
    <link data-trunk rel="rust" data-bin="shoopdaloop_egui" />
    <link data-trunk rel="copy-file" href="audio_worklet.js" />
    <link data-trunk rel="copy-dir" href="generated" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #181818;
      }

      #shoop_canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #audio_controls {
        position: fixed;
        right: 8px;
        bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #aaa;
        font: 11px sans-serif;
      }

      #enable_audio {
        border: 1px solid #f0b429;
        border-radius: 4px;
        padding: 5px 9px;
        color: #181818;
        background: #f0b429;
        cursor: pointer;
      }

      #enable_audio[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="shoop_canvas"></canvas>
    <div id="audio_controls">
      <button id="enable_audio" type="button">Enable microphone audio</button>
      <span id="runtime_status" data-driver-state="starting">Starting browser application…</span>
    </div>
    <noscript>This application requires JavaScript and WebAssembly. Browser microphone audio also requires HTTPS or localhost.</noscript>
  </body>
</html>

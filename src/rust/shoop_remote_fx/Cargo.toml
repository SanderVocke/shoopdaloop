[package]
name = "shoop_remote_fx"
version.workspace = true
edition = "2021"
description = "Bounded media and control transport for remote native FX"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rt_buffered = { path = "../rt_buffered" }
rt_runtime = { path = "../rt_runtime" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shoop_processor_protocol = { path = "../shoop_processor_protocol" }
socket2 = "0.6"
uuid = { workspace = true }

[dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

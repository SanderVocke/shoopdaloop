[package]
name = "shoop_dsp_link_native"
version.workspace = true
edition = "2021"

[dependencies]
shoop_dsp_link = { path = "../shoop_dsp_link" }
shoop_remote_dsp = { path = "../shoop_remote_dsp", features = ["serde"] }

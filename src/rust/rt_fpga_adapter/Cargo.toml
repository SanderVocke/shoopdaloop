[package]
name = "rt_fpga_adapter"
version.workspace = true
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = ["std"]
std = ["dep:schemars", "serde/std"]

[dependencies]
shoop_loops = { path = "../shoop_loops" }
rt_audio_math = { path = "../rt_audio_math" }
rt_runtime = { path = "../rt_runtime" }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
shoop_rt_engine = { path = "../shoop_rt_engine" }
serde = { workspace = true, features = ["derive"] }
schemars = { version = "1", optional = true }

[dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

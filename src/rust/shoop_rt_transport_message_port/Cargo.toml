[package]
name = "shoop_rt_transport_message_port"
version.workspace = true
edition = "2021"
description = "Main-thread and worklet sides of the MessagePort record carrier"

[lints]
workspace = true

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[features]
default = []
browser = ["dep:js-sys", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
shoop_rt_transport = { path = "../shoop_rt_transport" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["MessagePort"] }
wasm-bindgen = { version = "=0.2.127", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
shoop_rt_transport = { path = "../shoop_rt_transport", features = ["contracts"] }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

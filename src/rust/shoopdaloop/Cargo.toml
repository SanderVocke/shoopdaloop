[package]
name = "shoopdaloop"
version.workspace = true
edition = "2021"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"
no-default-features = true

[features]
default = ["native-fx"]
native-fx = ["shoop_backend/native-fx"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
eframe = { workspace = true }
shoop_app = { path = "../shoop_app" }
shoop_backend = { path = "../shoop_backend" }
shoop_egui = { path = "../shoop_egui" }
shoop_scripting = { path = "../shoop_scripting" }
shoop_script_resources = { path = "../shoop_script_resources" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
shoop_common = { path = "../shoop_common" }
shoop_backend = { path = "../shoop_backend", features = ["native-drivers"] }
shoop_settings = { path = "../shoop_settings", features = ["native-store"] }
rfd = { workspace = true, default-features = false, features = ["xdg-portal", "async-std"] }
rodio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
shoop_settings = { path = "../shoop_settings" }
rfd = { workspace = true, features = ["xdg-portal", "async-std"] }
js-sys = "0.3"
log = { workspace = true }
shoop_audio_protocol = { path = "../shoop_audio_protocol" }
shoop_session = { path = "../shoop_session" }
shoop_worklet_client = { path = "../shoop_worklet_client" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "Location",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackSettings",
    "MidiAccess",
    "MidiInput",
    "MidiInputMap",
    "MidiMessageEvent",
    "MidiOptions",
    "MidiOutput",
    "MidiOutputMap",
    "MidiPort",
    "MidiPortConnectionState",
    "MidiPortDeviceState",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Navigator",
    "Response",
    "Screen",
    "Storage",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Window",
] }

[dev-dependencies]
serde_json = { workspace = true }
shoop_session = { path = "../shoop_session" }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }
tempfile = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shoop_engine = { path = "../shoop_engine", features = ["app_backend"] }
shoop_plugin_protocol = { path = "../shoop_plugin_protocol" }
tracy-nextest-capture.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[lints]
workspace = true

[package]
name = "shoopdaloop"
version.workspace = true
edition = "2021"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"
no-default-features = true

[features]
default = ["cpal"]
cpal = ["dep:rodio", "shoop_rt_host_native/cpal", "shoop_host/cpal", "shoop_host_manager/cpal"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
shoop_rt_transport_message_port = { path = "../shoop_rt_transport_message_port", features = ["browser"] }
shoop_rt_transport = { path = "../shoop_rt_transport" }
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true }
eframe = { workspace = true }
shoop_app = { path = "../shoop_app", default-features = false, features = ["std"] }
shoop_app_protocol = { path = "../shoop_app_protocol" }
shoop_app_api = { path = "../shoop_app_api" }
shoop_session = { path = "../shoop_session" }
shoop_persistence_codec = { path = "../shoop_persistence_codec" }
shoop_app_client = { path = "../shoop_app_client", features = ["runtime"] }
shoop_backend = { path = "../shoop_backend", default-features = false }
shoop_egui = { path = "../shoop_egui" }
shoop_scripting = { path = "../shoop_scripting" }
shoop_script_resources = { path = "../shoop_script_resources" }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
tracing = { workspace = true, features = ["std"] }
ehttp = { workspace = true, features = ["streaming"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
shoop_host = { path = "../shoop_host", default-features = false }
shoop_host_manager = { path = "../shoop_host_manager", default-features = false }
shoop_common = { path = "../shoop_common" }
tempfile = { workspace = true }
shoop_rt_backend = { path = "../shoop_rt_backend" }
shoop_rt_engine = { path = "../shoop_rt_engine" }
shoop_rt_host_native = { path = "../shoop_rt_host_native", default-features = false }
shoop_settings = { path = "../shoop_settings", features = ["native-store"] }
rfd = { workspace = true, default-features = false, features = ["xdg-portal", "async-std"] }
rodio = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
shoop_settings = { path = "../shoop_settings" }
rfd = { workspace = true, features = ["xdg-portal", "async-std", "file-handle-inner"] }
futures-util = "0.3"
js-sys = "0.3"
log = { workspace = true }
shoop_rt_backend = { path = "../shoop_rt_backend" }
shoop_rt_engine = { path = "../shoop_rt_engine" }
# Without its exports, so the worklet module's entry points stay out of the application.
shoop_rt_host_worklet = { path = "../shoop_rt_host_worklet", default-features = false }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
shoop_tracing = { workspace = true, features = ["ordinary-web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "Blob",
    "BlobPropertyBag",
    "ErrorEvent",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "Location",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackSettings",
    "MediaQueryList",
    "MidiAccess",
    "MidiInput",
    "MidiInputMap",
    "MidiMessageEvent",
    "MidiOptions",
    "MidiOutput",
    "MidiOutputMap",
    "MidiPort",
    "MidiPortConnectionState",
    "MidiPortDeviceState",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Navigator",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Response",
    "Screen",
    "Storage",
    "Url",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Window",
] }

[dev-dependencies]
shoop_rt_engine = { path = "../shoop_rt_engine", features = ["testing"] }
shoop_backend = { path = "../shoop_backend", features = ["legacy"] }
serde_json = { workspace = true }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }
tempfile = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shoop_host = { path = "../shoop_host", default-features = false, features = ["testing"] }
shoop_plugin_protocol = { path = "../shoop_plugin_protocol" }
shoop_rt_host_worklet = { path = "../shoop_rt_host_worklet", default-features = false }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[lints]
workspace = true

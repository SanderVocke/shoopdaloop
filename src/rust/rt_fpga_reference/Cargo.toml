[package]
name = "rt_fpga_reference"
version.workspace = true
edition = "2021"
description = "Readable audio-only compiler/state/job reference for FPGA exploration"
publish = false

[features]
serde = ["dep:serde"]
schema = ["serde", "dep:schemars"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
schemars = { version = "1", optional = true }

[lints]
workspace = true

[dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

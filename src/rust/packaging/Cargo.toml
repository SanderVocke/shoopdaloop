[package]
name = "packaging"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "package"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }

walkdir = { workspace = true }
glob = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
copy_dir = { workspace = true }
tempfile = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
ctor = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

# Only the in-process dependency walkers need this, and only Windows and macOS
# use them -- Linux keeps its lddtree-based scanner. Target-gating keeps the
# Linux build unchanged.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
goblin = { workspace = true }

[lints]
workspace = true

[features]
# Dummy build to build dependencies only
prebuild = ["common/prebuild"]
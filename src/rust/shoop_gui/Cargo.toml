[package]
name = "shoop_gui"
edition = "2021"

[lib]
name = "shoop_gui"
path = "src/lib.rs"

[[bin]]
name = "shoop-gui"
path = "src/main.rs"

[dependencies]
shoop_engine = { path = "../shoop_engine", features = ["cpal", "midir"] }
eframe = { workspace = true }
egui = { workspace = true }
rtrb = { workspace = true }
midir = { workspace = true }
# `vendored` builds Lua from source, so this crate needs no system Lua. The feature is
# additive across the workspace and self-contained, so it does not change how the QML
# frontend links.
mlua = { workspace = true, features = ["vendored"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Matched to egui's version: the harness renders with the same egui the app does.
egui_kittest = { workspace = true }

[package]
name = "shoop_rt_host_native"
version.workspace = true
edition = "2021"
description = "Native engine host with JACK audio/MIDI, CPAL/midir and dummy drivers"

[lints]
workspace = true

[features]
carla = ["dep:rt_buffered", "dep:shoop_carla", "dep:shoop_plugin_protocol"]
builtin-fx = ["shoop_host_processors/builtin-fx"]
oxisynth = ["shoop_host_processors/oxisynth"]
default = ["cpal", "jack"]
jack = ["shoop_audio_drivers/jack"]
# CPAL audio and midir MIDI are independent of native JACK.
cpal = ["dep:cpal", "shoop_audio_drivers/cpal"]

[dependencies]
shoop_audio_drivers = {path="../shoop_audio_drivers",default-features=false}
shoop_host_processors = { path = "../shoop_host_processors" }
shoop_port_graph = { path = "../shoop_port_graph", features = ["std"] }
shoop_rt_transport = { path = "../shoop_rt_transport" }
rt_runtime = { path = "../rt_runtime" }
shoop_rt_engine = { path = "../shoop_rt_engine" }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
thiserror = { workspace = true, features = ["std"] }
cpal = { workspace = true, optional = true }

[dev-dependencies]
jack = {workspace=true}
shoop_jack = {path="../shoop_jack"}
tempfile = { workspace = true }
shoop_port_graph = { path = "../shoop_port_graph", features = ["testing"] }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rt_buffered = { path = "../rt_buffered", optional = true }
shoop_carla = { path = "../shoop_carla", features = ["buffered"], optional = true }
shoop_plugin_protocol = { path = "../shoop_plugin_protocol", optional = true }

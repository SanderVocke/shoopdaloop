[package]
name = "shoop_rt_host_native"
version.workspace = true
edition = "2021"
description = "Native engine host with JACK audio/MIDI, CPAL/midir and dummy drivers"

[lints]
workspace = true

[features]
default = ["cpal", "jack"]
jack = ["dep:jack", "dep:shoop_jack"]
# CPAL audio and midir MIDI are independent of native JACK.
cpal = ["dep:cpal", "dep:midir"]

[dependencies]
shoop_rt_transport = { path = "../shoop_rt_transport" }
rt_runtime = { path = "../rt_runtime" }
shoop_rt_engine = { path = "../shoop_rt_engine" }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
rtrb = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
cpal = { workspace = true, optional = true }
midir = { workspace = true, optional = true }

[dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jack = { workspace = true, optional = true }
shoop_jack = { path = "../shoop_jack", optional = true }

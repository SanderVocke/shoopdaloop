[package]
name = "shoop_rt_host_native"
version.workspace = true
edition = "2021"
description = "Native engine host with JACK audio/MIDI, CPAL/midir and dummy drivers"

[lints]
workspace = true

[features]
builtin-fx = ["shoop_host_processors/builtin-fx"]
oxisynth = ["shoop_host_processors/oxisynth"]
default = ["cpal", "jack"]
jack = ["dep:jack", "dep:shoop_jack", "dep:getrandom"]
# CPAL audio and midir MIDI are independent of native JACK.
cpal = ["dep:cpal", "dep:midir"]

[dependencies]
shoop_host_processors = { path = "../shoop_host_processors" }
shoop_port_graph = { path = "../shoop_port_graph", features = ["std"] }
shoop_rt_transport = { path = "../shoop_rt_transport" }
rt_runtime = { path = "../rt_runtime" }
shoop_rt_engine = { path = "../shoop_rt_engine" }
shoop_rt_protocol = { path = "../shoop_rt_protocol" }
rtrb = { workspace = true }
arrayvec = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
cpal = { workspace = true, optional = true }
midir = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
shoop_port_graph = { path = "../shoop_port_graph", features = ["testing"] }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.4", optional = true }
jack = { workspace = true, optional = true }
shoop_jack = { path = "../shoop_jack", optional = true }

[package]
name = "shoop_carla"
version.workspace = true
edition = "2021"

[lints]
workspace = true

[features]
native = ["dep:base64", "dep:getrandom", "dep:libloading", "dep:quick-xml", "dep:rfd", "dep:serde", "dep:serde_json", "dep:shoop_tracing", "dep:tracing"]
buffered = ["native", "dep:rt_buffered", "dep:rt_runtime"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, optional = true }
getrandom = { version = "0.4", optional = true }
libc = { workspace = true }
libloading = { workspace = true, optional = true }
memmap2 = { workspace = true }
quick-xml = { version = "0.41.0", features = ["serialize"], optional = true }
rfd = { workspace = true, default-features = false, features = ["xdg-portal", "async-std"], optional = true }
rt_buffered = { path = "../rt_buffered", optional = true }
rt_runtime = { path = "../rt_runtime", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
shoop_plugin_protocol = { path = "../shoop_plugin_protocol" }
shoop_tracing = { workspace = true, features = ["perfetto"], optional = true }
tempfile = { workspace = true }
tracing = { workspace = true, features = ["std"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }
uuid = { workspace = true }

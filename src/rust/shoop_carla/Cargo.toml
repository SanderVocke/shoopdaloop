[package]
name = "shoop_carla"
version.workspace = true
edition = "2021"

[lints]
workspace = true

[features]
native = ["dep:base64", "dep:libloading", "dep:rfd", "dep:serde_json", "dep:shoop_tracing", "dep:tracing"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, optional = true }
libc = { workspace = true }
libloading = { workspace = true, optional = true }
memmap2 = { workspace = true }
rfd = { workspace = true, default-features = false, features = ["xdg-portal", "async-std"], optional = true }
serde_json = { workspace = true, optional = true }
shoop_plugin_protocol = { path = "../shoop_plugin_protocol" }
shoop_tracing = { workspace = true, features = ["perfetto"], optional = true }
tempfile = { workspace = true }
tracing = { workspace = true, features = ["std"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }
uuid = { workspace = true }

[package]
name = "shoop_app_protocol"
version.workspace = true
edition = "2021"
description = "Portable application session messages and bounded wire codec"

[lints]
workspace = true

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[features]
default = ["std"]
std = ["serde/std", "bincode/std"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
shoop_midi_protocol = { path = "../shoop_midi_protocol" }
profiling_protocol = { path = "../profiling_protocol" }

shoop_app_api = { path = "../shoop_app_api", features = ["serde"] }
shoop_transport = { path = "../shoop_transport" }
serde = { workspace = true, features = ["derive", "rc"] }
bincode = { workspace = true }

[dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

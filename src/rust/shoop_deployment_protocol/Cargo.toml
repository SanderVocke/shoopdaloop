[package]
name = "shoop_deployment_protocol"
version.workspace = true
edition = "2021"
description = "Stable bounded deployment management envelope independent of session versions"

[lints]
workspace = true

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[features]
default = ["std"]
std = ["serde/std", "bincode/std"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }

[dev-dependencies]
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

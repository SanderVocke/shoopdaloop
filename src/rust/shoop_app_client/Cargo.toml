[package]
name = "shoop_app_client"
version.workspace = true
edition = "2021"
description = "Confirmed session projection and ordered UI/Lua app delivery"

[lints]
workspace = true

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[features]
runtime = ["dep:anyhow", "dep:shoop_scripting", "dep:tracing", "dep:shoop_session"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
anyhow = { workspace = true, optional = true, features = ["std"] }
tracing = { workspace = true, optional = true, features = ["std"] }
shoop_app_api = { path = "../shoop_app_api" }
shoop_scripting = { path = "../shoop_scripting", optional = true }
shoop_app_protocol = { path = "../shoop_app_protocol" }

shoop_session = { path = "../shoop_session", optional = true }

[dev-dependencies]
shoop_app_api = { path = "../shoop_app_api" }
shoop_transport = { path = "../shoop_transport" }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

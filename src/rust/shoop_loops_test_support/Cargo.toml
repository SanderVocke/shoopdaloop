[package]
name = "shoop_loops_test_support"
version.workspace = true
edition = "2021"
publish = false
description = "Dev-only assembly of the loop library into a runtime for tests and test hosts"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[lints]
workspace = true

[dependencies]
rt_runtime = { path = "../rt_runtime" }
shoop_loops = { path = "../shoop_loops" }

[features]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dev-dependencies]
shoop_example_dsp = { path = "../shoop_example_dsp" }
shoop_latency = { path = "../shoop_latency" }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shoop_engine = { path = "../shoop_engine", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

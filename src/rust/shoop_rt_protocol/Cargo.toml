[package]
name = "shoop_rt_protocol"
version.workspace = true
edition = "2021"
description = "Transport-neutral protocol between an application adapter and the new real-time engine"

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"

[lints]
workspace = true

[features]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dev-dependencies]
rt_profiling = { path = "../rt_profiling" }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[dependencies]
serde.workspace = true
profiling_protocol = { path = "../profiling_protocol" }

shoop_processor_protocol = { path = "../shoop_processor_protocol" }
shoop_transport = { path = "../shoop_transport" }

[package]
name = "shoop_dsp"
version.workspace = true
edition = "2021"
description = "Optional prepared host-side built-in FX and SoundFont synthesis"

[lints]
workspace = true

[package.metadata.shoop-wasm-test]
enabled = true
browser-feature = "wasm-test-browser"
features = ["builtin-fx", "oxisynth"]

[features]
default = []
testing = []
builtin-fx = ["dep:fundsp", "dep:rt_buffered", "dep:rt_runtime"]
oxisynth = ["dep:oxisynth", "dep:soundfont", "dep:anyhow", "dep:rt_buffered", "dep:rt_runtime"]
wasm-test-browser = ["shoop_wasm_test_support/wasm-test-browser"]

[dependencies]
shoop_processor_protocol = { path = "../shoop_processor_protocol" }
thiserror = { workspace = true, features = ["std"] }
anyhow = { workspace = true, features = ["std"], optional = true }
fundsp = { workspace = true, optional = true, features = ["realtime-reset"] }
oxisynth = { workspace = true, optional = true, features = ["realtime"] }
rt_buffered = { path = "../rt_buffered", optional = true }
rt_runtime = { path = "../rt_runtime", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
shoop_tracing = { workspace = true, features = ["perfetto"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
shoop_tracing = { workspace = true, default-features = false }

[build-dependencies]
soundfont = { workspace = true, optional = true }

[dev-dependencies]
sha2 = { workspace = true }
shoop_wasm_test_support = { path = "../shoop_wasm_test_support" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

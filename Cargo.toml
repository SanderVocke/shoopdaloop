[workspace]

resolver = "2"

members = ["src/rust/*"]

[workspace.lints.rust]
unknown_lints = "allow"
semicolon_in_expressions_from_non_local_macros = "allow"

[workspace.dependencies]
anyhow = "1.0"
glob = "0.3"
bindgen = "0.70"
log = "0.4"
colored = "2.1"
humantime = "2.1"
lazy_static = "1.5"
ctor = "0.2"
toml = "0.8"
regex = "1.10"
copy_dir = "0.1"
serde = "1.0"
minidumper = "0.8"
crash-handler = "0.6"
uuid = { version = "1.17", features = ["v4"] }
tempfile = "3.20"
serde_json = "1.0"
base64 = "0.22"
libloading = "0.8"
memmap2 = "0.9"
once_cell = "1.21"
cxx = "1.0"
tar = "0.4"
dunce = "1.0"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_material_icons = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
walkdir = "2.5"
indexmap = "2.5"
# Object-file parsing for the packaging dependency walker (PE imports on
# Windows, Mach-O load commands on macOS). Already in Cargo.lock at 0.8.2 via
# minidump-writer, so this adds no new dependency tree.
goblin = { version = "0.8", default-features = false, features = [
    "std",
    "pe32",
    "pe64",
    "mach32",
    "mach64",
] }
clap = { version = "4.5", features = ["derive"] }
quick-xml = { version = "0.38", features = ["serialize"] }
sndfile = { version = "0.1" }
json = "0.12"
midly = "0.5"
directories = "6.0"
# omniLua 0.7.1's `os` implementation references its `io` helper module, so
# both features are required even though Shoop's sandbox exposes no `io` table.
omnilua = { version = "=0.7.1", default-features = false, features = ["coroutine", "io", "os"] }
itertools = "0.14"
num_enum = "0.7"
enum-iterator = "2.1"
prettyplease = "0.2"
jsonschema = "0.33"
rodio = "0.21"
libc = "0.2"
winapi = "0.3"
assert2 = "0.3"
assert_no_alloc = "1.1"
arc-swap = "1.7"
rtrb = "0.3"
jack = "0.13"
# Pinned to what rodio (used by the frontend) already brings in: cpal declares
# links = "alsa", so two versions cannot coexist in one workspace.
# Enable all known cross-platform CPAL host features so that `--list-cpal-hosts`
# surfaces every available backend (ALSA, JACK, WASAPI, ASIO, CoreAudio).
cpal = { version = "0.16", features = ["jack", "asio"] }
midir = "0.11"
lilv = "0.2.4"
lv2_raw = "0.2"
# 0.16 rather than 4.0: the 4.x API works through audioadapter traits instead of
# plain sample planes, which buys nothing here.
rubato = "0.16"
thiserror = "2.0"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
hound = "3.5"
rfd = { version = "0.15", default-features = false }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-tracy = { version = "0.11", features = ["ondemand"] }
tracy-client = { version = "0.18.4", features = ["ondemand", "delayed-init", "timer-fallback"] }
shoop_tracing = { path = "src/rust/shoop_tracing", default-features = false }
tinyviolin = "=0.3.0"

# cxx-qt =  { path = "C:/sdev/cxx-qt/crates/cxx-qt" }
# qt-build-utils = { path = "C:/sdev/cxx-qt/crates/qt-build-utils" }
# cxx-qt-build = { path = "C:/sdev/cxx-qt/crates/cxx-qt-build" }
# cxx-qt-gen = { path = "C:/sdev/cxx-qt/crates/cxx-qt-gen" }
# cxx-qt-lib = { path = "C:/sdev/cxx-qt/crates/cxx-qt-lib" }
# cxx-qt-lib-extras = { path = "C:/sdev/cxx-qt/crates/cxx-qt-lib-extras" }
# cxx-qt-macro = { path = "C:/sdev/cxx-qt/crates/cxx-qt-macro" }

[profile.release-with-debug]
inherits = "release"
debug = true
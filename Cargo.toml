[workspace]

resolver = "2"

members = ["src/rust/*"]

[workspace.package]
version = "0.3.0"

[workspace.lints.rust]
unknown_lints = "allow"
semicolon_in_expressions_from_non_local_macros = "allow"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
colored = "3.1"
humantime = "2.1"
lazy_static = "1.5"
ctor = "1.0"
toml = "1.1"
regex = "1.10"
serde = "1.0"
uuid = { version = "1.17", features = ["v4"] }
tempfile = "3.20"
serde_json = "1.0"
base64 = "0.23"
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
libloading = "0.9"
memmap2 = "0.9"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_material_icons = "0.8"
egui_commonmark = { version = "0.25", default-features = false, features = ["load-images", "pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4.5", features = ["derive"] }
midly = "0.5"
directories = "6.0"
# omniLua 0.7.1's `os` implementation references its `io` helper module, so
# both features are required even though Shoop's sandbox exposes no `io` table.
omnilua = { version = "=0.7.1", default-features = false, features = ["coroutine", "io", "os"] }
num_enum = "0.7"
enum-iterator = "2.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
libc = "0.2"
assert2 = "0.4"
assert_no_alloc = "1.1"
arc-swap = "1.7"
rtrb = "0.4"
jack = "0.13"
jack-sys = { version = "0.5", features = ["dynamic_loading"] }
# Pinned to what rodio (used by the application) already brings in: cpal declares
# links = "alsa", so two versions cannot coexist in one workspace.
# Enable all known cross-platform CPAL host features so that `--list-cpal-hosts`
# surfaces every available backend (ALSA, JACK, WASAPI, ASIO, CoreAudio).
cpal = { version = "0.17", features = ["jack", "asio"] }
midir = "0.11"
rubato = "5.0"
thiserror = "2.0"
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
hound = "3.5"
rfd = { version = "0.16", default-features = false }
tracing = "0.1"
ehttp = "0.7"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
shoop_tracing = { path = "src/rust/shoop_tracing", default-features = false }
oxisynth = { version = "=0.1.0", default-features = false }
soundfont = "=0.1.0"
fundsp = { version = "=0.23.0", default-features = false, features = ["std"] }

[profile.release-with-debug]
inherits = "release"
debug = true

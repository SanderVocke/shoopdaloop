; Illustrative single-rank 512 MiB x16 DDR3-1066, not a board certification.
; Timings are rounded illustrative DDR3 assumptions at tCK=1.875 ns.
[dram_structure]
protocol = DDR3
bankgroups = 1
banks_per_group = 8
rows = 32768
columns = 1024
device_width = 16
BL = 8

[timing]
tCK = 1.875
AL = 0
CL = 7
CWL = 6
tRCD = 8
tRP = 8
tRAS = 20
tRFC = 139
tRFC2 = 139
tRFC4 = 139
tREFI = 4160
tRPRE = 0
tWPRE = 0
tRRD_S = 6
tRRD_L = 6
tWTR_S = 4
tWTR_L = 4
tFAW = 27
tWR = 8
tWR2 = 8
tRTP = 4
tCCD_S = 4
tCCD_L = 4
tCKE = 3
tCKESR = 4
tXS = 145
tXP = 4
tRTRS = 1

[power]
VDD = 1.5
IDD0 = 55
IDD2P = 18
IDD2N = 32
IDD3P = 38
IDD3N = 38
IDD4W = 125
IDD4R = 157
IDD5AB = 235
IDD6x = 20

[system]
channel_size = 512
channels = 1
bus_width = 16
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 32
unified_queue = true

[other]
epoch_period = 1000000000
output_level = 0

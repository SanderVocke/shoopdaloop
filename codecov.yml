# Harness-only Rust is executed inside Wasm, where the repository's native
# llvm-cov job cannot instrument it. Migrated production tests retain native
# execution and coverage; only adapters/fixtures are exempted here.
ignore:
  - "src/rust/shoop_test_macros/**"
  - "src/rust/shoop_wasm_test_support/**"
  - "src/rust/shoop_wasm_runtime_tests/**"

coverage:
  status:
    # Large ownership moves and target-specific provider/worklet code can make
    # native llvm-cov coverage fluctuate even when dedicated platform gates
    # execute those paths. Keep both tolerances bounded.
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 4%

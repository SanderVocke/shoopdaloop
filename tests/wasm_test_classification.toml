schema = 1

[[rules]]
pattern = "shoop_audio_protocol::*"
category = "shared"
reason = "Stage 1 pilot runs from the same source in native, Node, and Chromium."

[[rules]]
pattern = "shoop_wasm_test_support::*"
category = "shared"
reason = "Cross-target harness unit and integration contracts run in all three runtimes."

[[rules]]
pattern = "shoop_wasm_runtime_tests::*"
category = "wasm-runtime"
reason = "Production Worker, MessagePort, and staged raw-engine contracts require a Wasm JavaScript runtime."

[[rules]]
pattern = "shoop_app_api::*"

nextest-version = { required = "0.9.116" }

[profile.ci]
fail-fast = false
test-threads = 4
retries = 0
success-output = "never"
failure-output = "immediate-final"

[[profile.default.overrides]]
filter = 'test(/carla_processor::tests::bridge_/)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'test(/carla_processor::tests::bridge_/)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'test(=legacy::native::tests::native_dummy_satisfies_topology_capture_and_same_driver_switch)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'binary_id(/shoopdaloop::bin.shoopdaloop/) & test(/^settings::tests::/)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'binary_id(=shoop_host::recovery)'
threads-required = "num-test-threads"

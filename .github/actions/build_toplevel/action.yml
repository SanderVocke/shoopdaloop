# Top-level build script.

inputs:
  name:
    description: "Name for the build"
  release_build:
    description: "if true, does a release build. Otherwise, a debug build."
    default: 'false'
  prepare_kind:
    description: "Which prepare function to call (see prepare action)"
  python:
    description: "Python command to use"
  platform:
    description: "platform descriptor"
  package_kind:
    description: "Kind of package to build"
  second_package_kind:
    description: "Kind of package to build (additional)"
    default: null
  third_package_kind:
    description: "Kind of package to build (additional)"
    default: null
  coverage:
    description: "Whether to run coverage"
  upload_artifacts:
    description: "Whether to upload artifacts"
    default: 'true'
  upload_release_assets:
    default: 'false'
    description: "Whether to attempt uploading assets to a tag release."
  GITHUB_TOKEN:
    required: true
    description: "GitHub token"
  macos_target_version:
    required: false
    description: "macOS target version"
  vcpkg_rebuild:
    description: "whether to rebuild vcpkg packages"
  sentry_auth_token:
    type: string

runs:
  using: "composite"
  steps:
  - name: Store cwd
    if: always()
    shell: wrap-shell {0}
    id: cwd
    run: |
        echo "cwd=$(pwd)" | tee -a $GITHUB_OUTPUT
  - shell: wrap-shell {0}
    if: always()
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Preparing environment"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Download upload URL for release assets
    if: always() && inputs.upload_release_assets == 'true'
    uses: actions/download-artifact@v4
    with:
      name: release_upload_assets_url
      path: release_upload_assets_url
  - name: Set upload URL for release assets
    if: always() && inputs.upload_release_assets == 'true'
    shell: bash
    run: echo "release_upload_assets_url=$(cat release_upload_assets_url/release_upload_assets_url.txt)" | tee -a $GITHUB_ENV
  - name: set Cargo build flags (release)
    if: always() && inputs.release_build == 'true'
    shell: wrap-shell {0}
    run: |
      echo "ARTIFACT_VARIANT=release-${{ inputs.platform }}" | tee -a $GITHUB_ENV
      echo "CARGO_ARTIFACTS_DIR=$(${{ env.CONVERT_PATH_FN }} $(pwd)/target/release-with-debug)" | tee -a $GITHUB_ENV
  - name: set Cargo build flags (debug)
    if: always() && inputs.release_build != 'true' && inputs.coverage != 'true'
    shell: wrap-shell {0}
    run: |
      echo "ARTIFACT_VARIANT=debug-${{ inputs.platform }}" | tee -a $GITHUB_ENV
      echo "CARGO_ARTIFACTS_DIR=$(${{ env.CONVERT_PATH_FN }} $(pwd)/target/debug)" | tee -a $GITHUB_ENV
  - name: set Cargo build flags (coverage)
    if: always() && inputs.release_build != 'true' && inputs.coverage == 'true'
    shell: wrap-shell {0}
    run: |
      echo "ARTIFACT_VARIANT=coverage-${{ inputs.platform }}" | tee -a $GITHUB_ENV
      echo "CARGO_ARTIFACTS_DIR=$(${{ env.CONVERT_PATH_FN }} $(pwd)/target/debug)" | tee -a $GITHUB_ENV
  - name: More env settings
    shell: wrap-shell {0}
    if: always()
    run: |
      echo "PYTHON=${{ inputs.python }}" | tee -a $GITHUB_ENV
      echo "PIP=${{ inputs.python }} -m pip" | tee -a $GITHUB_ENV
      echo "PLATFORM=${{ inputs.platform }}" | tee -a $GITHUB_ENV
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Install Qoverage
    if: always() && inputs.coverage
    uses: ./.github/actions/install_qoverage
  - name: Prepare
    if: always()
    id: prepare
    uses: ./.github/actions/prepare_build
    with:
      variant: ${{ inputs.prepare_kind }}
      GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      macos_target_version: ${{ inputs.macos_target_version }}
      vcpkg_rebuild: ${{ inputs.vcpkg_rebuild }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Building"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Build
    if: always()
    id: build_base
    uses: ./.github/actions/build_base
    with:
        release_build: ${{ inputs.release_build }}
        coverage: ${{ inputs.coverage }}
  - name: Qoverage - Instrument QML files
    if: always() && inputs.coverage
    uses: ./.github/actions/qoverage_instrument
    with:
      glob_string: ./src/qml/**/*.qml
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always() && inputs.package_kind
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Build package: ${{ inputs.package_kind }}"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Build package
    id: package
    if: always() && inputs.package_kind
    uses: ./.github/actions/build_package
    with:
      package_kind: ${{ inputs.package_kind }}
      upload_release_assets: ${{ inputs.upload_release_assets }}
      release_upload_assets_url: ${{ env.release_upload_assets_url }}
      sentry_auth_token: ${{ inputs.sentry_auth_token }}
  - name: Verify portable folder executable
    if: always() && inputs.package_kind == 'portable_folder'
    shell: wrap-shell {0}
    run: |
      echo "Verifying portable-folder executable without build-environment dependencies..."
      if [ "${{ runner.os }}" = "Windows" ]; then
        portable_exe="$PORTABLE_DIR/shoopdaloop.bat"
      elif [ "${{ runner.os }}" = "macOS" ]; then
        portable_exe="$PORTABLE_DIR/Contents/MacOS/shoopdaloop"
      else
        portable_exe="$PORTABLE_DIR/shoopdaloop"
      fi
      if [ ! -f "$portable_exe" ]; then
        echo "Portable-folder executable not found: $portable_exe" >&2
        exit 1
      fi
      # `--help` is handled by the argument parser before any QML engine is
      # constructed, so it loads no Qt plugins and cannot detect a package that
      # is missing them. Grab screenshots instead: that builds the real UI, and
      # 70-odd QML files import QtQuick.Controls, so a missing
      # Qt6QuickControls2 fails here rather than in a user's hands.
      #
      # The screenshots are also the positive signal. Without an artifact to
      # check for, a run that exited 0 without ever constructing the UI would
      # pass the check vacuously.
      #
      # QT_QPA_PLATFORM=offscreen is set for the whole workflow, so this needs no
      # display. Note the consequence: the native platform plugin is not loaded,
      # so this cannot detect a missing qwindows/qcocoa plugin -- but the Qt Quick
      # Controls stack is loaded regardless of platform plugin, which is what this
      # is guarding.
      shots="${RUNNER_TEMP:-/tmp}/portable_verify_shots"
      rm -rf "$shots"
      log="${RUNNER_TEMP:-/tmp}/portable_verify.log"
      # Time-boxed and process-tree-killing: a package that hangs on startup must
      # fail the job rather than stall the runner.
      timeout_cmd="./scripts/run_with_timeout.sh 300"
      if [ "${{ runner.os }}" = "Windows" ]; then
        # wrap-shell runs Bash (via gha_bash_with_custom_fail.sh), but Windows
        # uses PATH to locate the executable and its DLLs. Keep system tools
        # available while removing the build/vcpkg paths explicitly.
        portable_path="$PORTABLE_DIR"
        build_path="$(pwd)/build/vcpkg_installed/x64-windows/bin"
        debug_build_path="$(pwd)/build/vcpkg_installed/x64-windows/debug/bin"
        clean_path=$(printf '%s' "$PATH" | tr ';' '\n' | grep -Fiv "$build_path" | grep -Fiv "$debug_build_path" | paste -sd ';' -)
        PATH="$portable_path;$clean_path" CMAKE_PREFIX_PATH= VCPKG_ROOT= \
          $timeout_cmd "$portable_exe" --test-grab-screens "$shots" >"$log" 2>&1 \
          || verify_failed=1
      else
        # DYLD_* must be unset as well as LD_LIBRARY_PATH. The packaging step
        # prepends the vcpkg runtime directories to DYLD_LIBRARY_PATH in this
        # same process tree, which would let the app find libraries that are
        # missing from the bundle and mask the exact failure being tested for.
        env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            -u DYLD_FRAMEWORK_PATH -u CMAKE_PREFIX_PATH -u VCPKG_ROOT \
          $timeout_cmd "$portable_exe" --test-grab-screens "$shots" >"$log" 2>&1 \
          || verify_failed=1
      fi
      cat "$log"
      if [ -n "${verify_failed:-}" ]; then
        echo "Portable-folder executable failed to start." >&2
        exit 1
      fi
      # A plugin that cannot be loaded is reported as a warning, not a non-zero
      # exit code, so the log has to be inspected explicitly. These patterns are
      # the loader's own wording -- deliberately specific, since something as
      # generic as "No such file or directory" appears in benign output too and
      # would make this check fail at random.
      if grep -Eq "Cannot load library|QQmlApplicationEngine failed to load component|module .* is not installed|Failed to extract plugin meta data|image not found|Library not loaded" "$log"; then
        echo "Portable folder is missing libraries (see log above)." >&2
        exit 1
      fi
      if [ -z "$(find "$shots" -name '*.png' -size +0 2>/dev/null | head -n 1)" ]; then
        echo "No screenshots were produced; the UI did not load." >&2
        exit 1
      fi
      echo "Portable folder verified: UI loaded and produced screenshots."
  - shell: wrap-shell {0}
    if: always() && inputs.second_package_kind
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Build package: ${{ inputs.second_package_kind }}"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Build second package
    id: second_package
    if: always() && inputs.second_package_kind
    uses: ./.github/actions/build_package
    with:
      package_kind: ${{ inputs.second_package_kind }}
      upload_release_assets: ${{ inputs.upload_release_assets }}
      release_upload_assets_url: ${{ env.release_upload_assets_url }}
      sentry_auth_token: ${{ inputs.sentry_auth_token }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always() && inputs.third_package_kind
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Build package: ${{ inputs.third_package_kind }}"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Build third package
    id: third_package
    if: always() && inputs.third_package_kind
    uses: ./.github/actions/build_package
    with:
      package_kind: ${{ inputs.third_package_kind }}
      upload_release_assets: ${{ inputs.upload_release_assets }}
      release_upload_assets_url: ${{ env.release_upload_assets_url }}
      sentry_auth_token: ${{ inputs.sentry_auth_token }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Upload artifacts"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Upload vcpkg-generated dependency builds
    if: always() && inputs.upload_artifacts == 'true'
    uses: actions/upload-artifact@v4
    with:
      name: vcpkg_dependencies_installed_${{ inputs.name }}
      path: build/vcpkg_installed
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Upload release assets"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Compress PDB files
    if: always() && env.release_upload_assets_url && inputs.prepare_kind == 'windows'
    id: compress_pdb
    shell: bash
    run: |
      find target -name "*.pdb" -o -name "*.PDB" | tar -czf ${{ inputs.name }}_pdb_files.tar.gz -T -
      echo "path=${{ inputs.name }}_pdb_files.tar.gz" | tee -a $GITHUB_OUTPUT
  - name: Upload PDB files
    if: always() && env.release_upload_assets_url && inputs.prepare_kind == 'windows'
    uses: shogo82148/actions-upload-release-asset@v1
    with:
      upload_url: ${{ env.release_upload_assets_url }}
      asset_path: ${{ steps.compress_pdb.outputs.path }}

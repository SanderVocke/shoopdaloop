name: Install Tracy capture
description: Install the pinned Tracy 0.13.1 command-line capture tool

outputs:
  tracy_capture_tool:
    description: Absolute path to tracy-capture
    value: ${{ steps.install.outputs.tracy_capture_tool }}
  tracy_version:
    description: Pinned Tracy protocol/tool version
    value: ${{ steps.install.outputs.tracy_version }}

runs:
  using: composite
  steps:
    - name: Download and verify Tracy capture
      id: install
      shell: bash
      run: |
        set -euo pipefail

        version=0.13.1
        base_url=https://github.com/SanderVocke/shoopdaloop/releases/download/build-assets-2
        archive_kind=nested_tar
        tool_name=tracy-capture

        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)
            asset=tracy-linux-x64.tar.gz.zip
            asset_sha256=49744c7a44a305c570de07fdf47da021e2991252e540830889e79848a8ca0b65
            ;;
          macOS/X64)
            asset=tracy-macos-x64.tar.gz.zip
            asset_sha256=73f1612576b6bd3788c50a31bd30ecc8b8f401d90fd9ec8178f141cc94e15b85
            ;;
          macOS/ARM64)
            asset=tracy-macos-arm64.tar.gz.zip
            asset_sha256=df1724fc7b7087a2a1fe5cedcc02c5858a2f83d2be88ecd4150d19de06b90317
            ;;
          Windows/X64)
            asset=tracy-windows-msvc-x64.zip
            asset_sha256=e8210f590cc8513730440aa11a511faae20c6890491e91a0ebfa9af3a35eb5a7
            archive_kind=zip
            tool_name=tracy-capture.exe
            ;;
          *)
            echo "Tracy capture CI installation does not support ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP}/tracy-capture-${version}"
        rm -rf "${install_dir}"
        mkdir -p "${install_dir}"

        curl --fail --location --retry 3 --retry-all-errors \
          --output "${install_dir}/asset.zip" "${base_url}/${asset}"
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${asset_sha256}  ${install_dir}/asset.zip" | sha256sum --check --strict
        else
          actual_sha256="$(shasum -a 256 "${install_dir}/asset.zip" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${asset_sha256}" ]]; then
            echo "SHA-256 mismatch for ${asset}: expected ${asset_sha256}, got ${actual_sha256}" >&2
            exit 1
          fi
        fi
        unzip -q "${install_dir}/asset.zip" -d "${install_dir}"

        if [[ "${archive_kind}" == nested_tar ]]; then
          tarball_count="$(find "${install_dir}" -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
          if [[ "${tarball_count}" -ne 1 ]]; then
            echo "Expected exactly one Tracy tarball, found ${tarball_count}" >&2
            find "${install_dir}" -type f -name '*.tar.gz' -print >&2
            exit 1
          fi
          tarball="$(find "${install_dir}" -type f -name '*.tar.gz' -print | head -n 1)"
          tar -xzf "${tarball}" -C "${install_dir}"
        fi

        tool_count="$(find "${install_dir}" -type f -name "${tool_name}" | wc -l | tr -d '[:space:]')"
        if [[ "${tool_count}" -ne 1 ]]; then
          echo "Expected exactly one ${tool_name} executable, found ${tool_count}" >&2
          find "${install_dir}" -type f -name "${tool_name}" -print >&2
          exit 1
        fi
        tool_path="$(find "${install_dir}" -type f -name "${tool_name}" -print | head -n 1)"
        tool_dir="$(cd "$(dirname "${tool_path}")" && pwd -P)"
        tool="${tool_dir}/$(basename "${tool_path}")"
        chmod +x "${tool}"
        help_output="$("${tool}" --help 2>&1 || true)"
        if ! grep -Fq 'Usage: capture -o output.tracy' <<<"${help_output}"; then
          echo "Downloaded Tracy capture tool failed its usage check" >&2
          echo "${help_output}" >&2
          exit 1
        fi

        echo "tracy_capture_tool=${tool}" | tee -a "${GITHUB_OUTPUT}"
        echo "tracy_version=${version}" | tee -a "${GITHUB_OUTPUT}"

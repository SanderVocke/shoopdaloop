# Top-level test script.

inputs:
  package:
    description: "Package artifact to install"
  second_package:
    description: "Second package artifact to install"
  asan:
    description: "Whether to enable ASAN"
  coverage:
    description: "Whether to gather code coverage"
  python:
    description: "python command"
  name:
    description: "workflow name"
  codecov_token:
    description: "Token for CodeCov"
  install_with_sudo:
    description: "Whether to install with sudo"
    default: 'false'
  do_qml_tests:
    description: "Whether to do the QML test step."
    default: 'true'
  sentry_key:
    type: string
  sentry_build_type:
    type: string
  run_cmd_prefix:
    type: string
    default: ''
  capture_traces:
    description: Capture and upload one Tracy trace per QML test file
    default: 'false'

runs:
  using: "composite"
  steps:
  - name: env settings
    if: always()
    shell: wrap-shell {0}
    run: |
      echo "PYTHON=${{ inputs.python }}" | tee -a $GITHUB_ENV
      echo "PIP=${{ inputs.python }} -m pip" | tee -a $GITHUB_ENV
      echo "ASAN_OPTIONS=detect_leaks=0,new_delete_type_mismatch=0" | tee -a $GITHUB_ENV
      echo 'SHOOP_CRASH_METADATA_BASE_JSON={"environment": "ci", "tags": {"ci_build_type": "${{ inputs.sentry_build_type }}", "ci_run": "${{ github.run_id }}", "vc_ref": "${{ github.ref }}"}}' | tee -a $GITHUB_ENV
      echo 'RUN_CMD_PREFIX=${{ inputs.run_cmd_prefix }} ${{ env.RUN_CMD_PREFIX }}' | tee -a $GITHUB_ENV
      echo 'SHOOP_ALLOW_MISSING_BACKENDS=1' | tee -a $GITHUB_ENV

  - name: Setup dependencies checker (Windows)
    if: always() && runner.os == 'Windows'
    shell: wrap-shell {0}
    run: |
       curl -L https://github.com/lucasg/Dependencies/releases/download/v1.11.1/Dependencies_x64_Release.zip --output dependencies.zip
       unzip dependencies.zip -d dependencies
       echo "$(cygpath -w $(pwd)/dependencies)" | tee -a $GITHUB_PATH
  - name: Setup coreutils (MacOS)
    if: always() && runner.os == 'macOS'
    shell: wrap-shell {0}
    run: |
       brew install coreutils
  - shell: wrap-shell {0}
    if: always() && inputs.package
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Install package ${{ inputs.package }}"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Retrieve package
    if: always() && inputs.package
    uses: actions/download-artifact@v4
    with:
      pattern: ${{ inputs.package }}
      path: ./package
      merge-multiple: true
  - name: Find package
    if: always() && inputs.package
    id: find_package
    shell: wrap-shell {0}
    run: |
      echo "package=$(pwd)/package/$(ls package | head -n1)" | tee -a $GITHUB_OUTPUT
  - uses: ./.github/actions/checkpoint
  - name: Install package (${{ inputs.package }})
    if: always() && inputs.package
    id: install_package
    uses: ./.github/actions/install_package
    with:
      package: ${{ steps.find_package.outputs.package }}
      coverage: ${{ inputs.coverage }}
      sudo: ${{ inputs.install_with_sudo }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always() && inputs.second_package
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Install package ${{ inputs.second_package }}"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Retrieve package
    if: always() && inputs.second_package
    uses: actions/download-artifact@v4
    with:
      pattern: ${{ inputs.second_package }}
      path: ./second_package
      merge-multiple: true
  - name: Find package
    if: always() && inputs.second_package
    id: find_package_2
    shell: wrap-shell {0}
    run: |
      echo "package=$(pwd)/second_package/$(ls second_package | head -n1)" | tee -a $GITHUB_OUTPUT
  - uses: ./.github/actions/checkpoint
  - name: Install package (${{ inputs.second_package }})
    if: always() && inputs.second_package
    id: install_package_2
    uses: ./.github/actions/install_package
    with:
      package: ${{ steps.find_package_2.outputs.package }}
      coverage: ${{ inputs.coverage }}
      sudo: ${{ inputs.install_with_sudo }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Preparing environment"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Create crashdumps folder
    if: always()
    shell: wrap-shell {0}
    run: |
      mkdir -p crashdumps
      echo "SHOOP_CRASHDUMP_DIR=$(pwd)/crashdumps" | tee -a $GITHUB_ENV
  - name: Prepare Rust for coverage tooling
    if: always() && inputs.coverage == 'true'
    uses: actions-rust-lang/setup-rust-toolchain@v1
    with:
      toolchain: stable
      components: llvm-tools-preview
      cache: false
      rustflags: ""
  - name: Locate LLVM coverage tools
    if: always() && inputs.coverage == 'true'
    shell: bash
    run: |
      llvm_tools_dir="$(dirname "$(rustc --print target-libdir)")/bin"
      llvm_cov="$llvm_tools_dir/llvm-cov"
      llvm_profdata="$llvm_tools_dir/llvm-profdata"
      if [[ ! -x "$llvm_cov" || ! -x "$llvm_profdata" ]]; then
        echo "LLVM coverage tools not found in $llvm_tools_dir" >&2
        exit 1
      fi
      echo "LLVM_COV=$llvm_cov" | tee -a "$GITHUB_ENV"
      echo "LLVM_PROFDATA=$llvm_profdata" | tee -a "$GITHUB_ENV"
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Install Qoverage
    if: always() && inputs.coverage
    uses: ./.github/actions/install_qoverage
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Start JACK server"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  # - name: Start JACK
  #   if: always()
  #   uses: ./.github/actions/start_jack
  #   env:
  #      GHA_RUN_ALWAYS: 1
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always() && env.COMMAND_TEST_RUST != ''
    env:
       GHA_RUN_ALWAYS: 1
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Rust test"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Test Rust
    if: always() && env.COMMAND_TEST_RUST != ''
    uses: ./.github/actions/test_rust
    env:
      LLVM_REPORTNAME: rust_lcov
      GHA_RUN_ALWAYS: 1
  - name: Upload Carla subprocess benchmark evidence
    if: always() && env.COMMAND_TEST_RUST != ''
    uses: actions/upload-artifact@v4
    with:
      name: carla-subprocess-benchmarks-${{ inputs.name }}-${{ github.run_id }}
      path: carla-subprocess-benchmarks
      if-no-files-found: warn
      retention-days: 30
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Cleanup Rust test binaries between coverage runs
    if: always() && inputs.coverage == 'true' && env.NEXTEST_EXTRACT_DIR != ''
    shell: bash
    run: |
      echo "Removing nextest extraction directory $NEXTEST_EXTRACT_DIR"
      rm -rf "$NEXTEST_EXTRACT_DIR"
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Install Tracy capture for QML tests
    id: tracy_capture
    if: always() && (inputs.capture_traces == 'true' || env.QML_TRACE_CAPTURE_ENABLED == 'true') && inputs.do_qml_tests == 'true'
    uses: ./.github/actions/install_tracy_capture
  - shell: wrap-shell {0}
    if: always() && (inputs.do_qml_tests == 'true')
    env:
       GHA_RUN_ALWAYS: 1
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "QML test"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Test QML
    if: always() && (inputs.do_qml_tests == 'true')
    uses: ./.github/actions/test_qml
    env:
      LLVM_REPORTNAME: qml_rust_lcov
      GHA_RUN_ALWAYS: 1
    with:
      variant_name: release
      macos_rpath_patch: ${{ contains(inputs.name, 'macos') }}
      tee_all_output_to: test-qml-console-output.log
      capture_traces: ${{ inputs.capture_traces == 'true' || env.QML_TRACE_CAPTURE_ENABLED == 'true' }}
      tracy_capture_tool: ${{ steps.tracy_capture.outputs.tracy_capture_tool }}
      tracy_capture_output_dir: traces/qml
  - name: Test packaged Carla subprocess mode
    if: always() && inputs.do_qml_tests == 'true' && inputs.coverage != 'true' && env.COMMAND_TEST_RUST != ''
    shell: wrap-shell {0}
    env:
      GHA_RUN_ALWAYS: 1
    run: |
      QT_ASSUME_STDERR_HAS_CONSOLE=1 \
        ./scripts/run_with_timeout.sh 600 \
        ${{ env.COMMAND_SHOOPDALOOP }} --self-test \
        --carla-hosting-mode-for-test subprocess \
        --test-files-pattern "$PORTABLE_FOLDER_INSTALL/qml/test/tst_TrackControlAndLoop_drywet_carla.qml"
  - name: Write QML trace metadata
    if: always() && (inputs.capture_traces == 'true' || env.QML_TRACE_CAPTURE_ENABLED == 'true')
    shell: bash
    run: |
      mkdir -p trace-artifact
      cat > trace-artifact/metadata.txt <<EOF
      git_sha=${GITHUB_SHA}
      run_id=${GITHUB_RUN_ID}
      run_attempt=${GITHUB_RUN_ATTEMPT}
      variant=${{ inputs.name }}
      runner_os=${RUNNER_OS}
      runner_arch=${RUNNER_ARCH}
      tracy_version=${{ steps.tracy_capture.outputs.tracy_version }}
      capture_boundary=qml_test_file
      capture_output_dir=traces/qml
      EOF
  - name: Validate QML trace captures
    if: always() && (inputs.capture_traces == 'true' || env.QML_TRACE_CAPTURE_ENABLED == 'true')
    shell: bash
    run: |
      set -euo pipefail
      if [[ ! -d traces/qml ]]; then
        echo "QML Tracy capture directory was not created" >&2
        exit 1
      fi
      trace_count="$(find traces/qml -type f -name '*.tracy' -size +0c | wc -l | tr -d '[:space:]')"
      if [[ "${trace_count}" -eq 0 ]]; then
        echo "No non-empty QML Tracy captures were produced" >&2
        exit 1
      fi
      if [[ ! -s traces/qml/manifest.tsv ]]; then
        echo "QML Tracy capture manifest is missing or empty" >&2
        exit 1
      fi
      echo "Captured ${trace_count} non-empty QML trace files for ${{ inputs.name }}"
  - name: Upload QML trace files
    if: always() && (inputs.capture_traces == 'true' || env.QML_TRACE_CAPTURE_ENABLED == 'true')
    uses: actions/upload-artifact@v4
    with:
      name: qml-traces-${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      path: |
        traces/qml
        trace-artifact
        test-qml-console-output.log
        reports/qml_test_results.xml
      if-no-files-found: error
      retention-days: 30
      compression-level: 0
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Qoverage - Generate report
    if: always() && inputs.coverage && (inputs.do_qml_tests == 'true')
    uses: ./.github/actions/qoverage_generate_report
    env:
       GHA_RUN_ALWAYS: 1
    with:
      strip: ".*/pip/shoopdaloop"
      package_path: ${{ env.PORTABLE_FOLDER_INSTALL }}
      console_output_file: test-qml-console-output.log
      report_file: coverage_reports/qml_qoverage.xml
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Screenshots"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Screenshots
    if: always()
    uses: ./.github/actions/test_screenshots
    env:
      GHA_RUN_ALWAYS: 1
    with:
      root_path: ${{ steps.install_package.outputs.install_dir }}
      screenshots_path: _grabbed_screenshots
      artifact_name: screenshots_${{ inputs.name }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Monkey test"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Test Run App
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    uses: ./.github/actions/test_run_app
    with:
      variant_name: release
      root_path: ${{ steps.install_package.outputs.install_dir }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Crash Handler Test"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Test Crash Handler
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    uses: ./.github/actions/test_crash_handler
    with:
      variant_name: release
      root_path: ${{ steps.install_package.outputs.install_dir }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - shell: wrap-shell {0}
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    run: |
      printf "\n\n\n\n\n\n"
      echo "=========================================="
      echo "Processing results"
      echo "=========================================="
      printf "\n\n\n\n\n\n"
  - name: Process Crash Dumps
    if: always()
    env:
       GHA_RUN_ALWAYS: 1
    uses: ./.github/actions/process_crashdumps
    with:
      dumps_dir: crashdumps
      sentry_key: ${{ inputs.sentry_key }}
  - uses: ./.github/actions/checkpoint
    if: always()
  - name: Upload Rust test coverage to CodeCov
    if: always() && inputs.coverage && env.COMMAND_TEST_RUST != ''
    uses: codecov/codecov-action@v3
    env:
       GHA_RUN_ALWAYS: 1
    with:
      token: ${{ inputs.codecov_token }}
      flags: rust
      files: coverage_reports/rust_lcov.info
      verbose: true
      fail_ci_if_error: true
  - name: Upload QML test coverage to CodeCov
    if: always() && inputs.coverage && (inputs.do_qml_tests == 'true')
    uses: codecov/codecov-action@v3
    env:
       GHA_RUN_ALWAYS: 1
    with:
      token: ${{ inputs.codecov_token }}
      flags: qml
      files: coverage_reports/qml_rust_lcov.info,coverage_reports/qml_qoverage.xml
      verbose: true
      fail_ci_if_error: true
  - name: Upload raw coverage reports
    if: always() && inputs.coverage
    uses: actions/upload-artifact@v4
    env:
       GHA_RUN_ALWAYS: 1
    with:
      name: coverage_reports
      path: coverage_reports
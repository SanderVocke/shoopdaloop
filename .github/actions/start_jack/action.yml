name: Start JACK server
description: >
  Start a dummy-backend jackd so the real-JACK tests actually execute. Without a running
  server those tests used to bail out early and report passes, which is how a JACK output
  path that produced pure silence stayed green in CI.

runs:
  using: "composite"
  steps:
  - name: Opt out of backend-dependent tests (non-Linux)
    if: always() && runner.os != 'Linux'
    shell: wrap-shell {0}
    run: |
      # macOS and Windows runners have no usable audio backend, so backend-dependent
      # tests report a skip there instead of failing.
      echo "SHOOP_ALLOW_MISSING_BACKENDS=1" | tee -a $GITHUB_ENV

  - name: Start jackd (Linux)
    if: always() && runner.os == 'Linux'
    shell: wrap-shell {0}
    run: |
      set -e

      # install_jack2 builds into /usr/local by default.
      export PATH="/usr/local/bin:$PATH"
      export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
      sudo ldconfig || true

      if ! command -v jackd >/dev/null 2>&1; then
        echo "jackd not found on PATH; the install_jack2 step must run before this one." >&2
        exit 1
      fi

      mkdir -p jack_logs
      # The dummy backend needs no sound card, which is what the runners have. Buffer and
      # rate are pinned so a test asserting on cycle sizes sees the same numbers everywhere.
      nohup jackd -r -d dummy -r 48000 -p 256 > jack_logs/jackd.log 2>&1 &
      echo "JACKD_PID=$!" | tee -a $GITHUB_ENV

      # Poll for readiness rather than sleeping a guessed interval.
      ready=0
      for i in $(seq 1 30); do
        if jack_lsp >/dev/null 2>&1; then
          ready=1
          break
        fi
        sleep 0.5
      done

      if [ "$ready" != "1" ]; then
        echo "jackd did not become ready within 15s. Log:" >&2
        cat jack_logs/jackd.log >&2 || true
        exit 1
      fi

      echo "jackd is up; ports:"
      jack_lsp
      echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" | tee -a $GITHUB_ENV

  - name: Upload jackd log
    if: always() && runner.os == 'Linux'
    uses: actions/upload-artifact@v4
    with:
      name: jackd-log-${{ github.job }}-${{ runner.os }}
      path: jack_logs
      if-no-files-found: ignore

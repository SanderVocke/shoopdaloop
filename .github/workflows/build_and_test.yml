name: Build and Test ShoopDaLoop

on:
  push:
    branches: ["master"]
    tags: "v*.*.*"
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      nightly_flavor:
        description: Run only a selected CPAL-free nightly build flavor
        required: false
        default: none
        type: choice
        options:
          - none
          - all
          - linux
          - macos-intel
          - macos-intel-10.15
      perfetto_failure_canary:
        description: Run the intentional nextest failure-capture canary
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

env:
  RUST_BACKTRACE: "1"
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  # Enable coarse and detailed engine events in every native nextest capture.
  SHOOP_CI_TRACING_ENGINE_DETAIL: "1"

jobs:
  rust_coverage:
    if: github.event_name != 'workflow_dispatch' || inputs.nightly_flavor == 'none'
    name: Rust coverage (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable with coverage tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.116

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential libasound2-dev libfluidsynth-dev libgl1-mesa-dev libgtk-3-dev \
            libgtk2.0-dev libjack-jackd2-dev liblo-dev libmagic-dev libpulse-dev \
            libsndfile1-dev libx11-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libwayland-dev \
            protobuf-compiler

      - name: Generate Rust coverage
        env:
          SHOOP_ALLOW_MISSING_BACKENDS: 1
          SHOOP_TEST_TRACE: failure
          SHOOP_TEST_TRACE_DIR: ${{ runner.temp }}/perfetto-nextest-rust-coverage
        run: |
          mkdir -p "$SHOOP_TEST_TRACE_DIR"
          cargo llvm-cov nextest --locked --workspace \
            --features shoop_engine/app_backend --profile ci \
            --lcov --output-path lcov.info

      - name: Publish Rust coverage to Codecov
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: rust

      - name: Upload Perfetto failure captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perfetto-nextest-rust-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/perfetto-nextest-rust-coverage/*.pftrace
          if-no-files-found: ignore
          retention-days: 14

  without_cpal:
    name: Nightly without CPAL (${{ matrix.flavor }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly_flavor != 'none')
    runs-on: ${{ matrix.flavor == 'linux' && 'ubuntu-24.04' || 'macos-15-intel' }}
    defaults:
      run:
        shell: bash
    env:
      NATIVE_BUILD_TARGET: ${{ matrix.flavor == 'linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-apple-darwin' }}
      RUSTFLAGS: "-D warnings"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.nightly_flavor != 'all' && format('["{0}"]', inputs.nightly_flavor) || '["linux","macos-intel","macos-intel-10.15"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.NATIVE_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.flavor == 'macos-intel-10.15' && 'macos-intel-10.15-portable-release' || format('without-cpal-{0}', matrix.flavor) }}
          cache-on-failure: ${{ matrix.flavor == 'macos-intel-10.15' }}
      - name: Configure macOS deployment target
        if: matrix.flavor == 'macos-intel-10.15'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=10.15' >> "$GITHUB_ENV"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libjack-jackd2-dev libgl1-mesa-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev libwayland-dev
      - name: Assert production and test graphs exclude CPAL and Rodio
        shell: bash
        run: |
          cargo tree --locked --workspace --no-default-features --features shoopdaloop/native-fx \
            --target ${{ env.NATIVE_BUILD_TARGET }} --edges normal,build,dev --prefix none --format '{p}' > dependency-tree.txt
          if grep -E '^(cpal|rodio) v' dependency-tree.txt; then
            echo 'CPAL-free builds must not enable CPAL or Rodio, including through test dependencies.'
            exit 1
          fi
      - name: Test packaging checks
        if: matrix.flavor == 'macos-intel-10.15'
        run: python3 -m unittest discover -s scripts/tests
      - name: Prepare pinned macOS Carla runtime
        if: matrix.flavor == 'macos-intel-10.15'
        run: |
          bash scripts/build_macos_catalina_dependencies.sh .catalina-deps
          curl -L --fail --retry 3 -o carla.dmg https://github.com/falkTX/Carla/releases/download/v2.5.10/Carla-2.5.10-macOS-universal.dmg
          echo "a30e98409974493ade18f598566628369fee67f179a84e1c2cc3ae46a71808b1  carla.dmg" | shasum -a 256 --check
          mkdir .carla-volume
          hdiutil attach carla.dmg -nobrowse -readonly -mountpoint .carla-volume
          trap 'hdiutil detach .carla-volume' EXIT
          curl -L --fail --retry 3 -o carla-GPL.txt https://raw.githubusercontent.com/falkTX/Carla/v2.5.10/doc/GPL.txt
          python3 scripts/carla_runtime.py normalize --platform macos --search-root .carla-volume --license carla-GPL.txt --output .carla-component --macos-dependency-dir .catalina-deps
          python3 scripts/check_macos_compatibility.py --root .carla-component --arch x86_64 --minimum-os 10.15 | tee carla-compatibility.txt
      - name: Build without CPAL or Rodio
        if: matrix.flavor != 'macos-intel-10.15'
        run: cargo build --locked -p shoopdaloop --no-default-features --features native-fx --target ${{ env.NATIVE_BUILD_TARGET }}
      - name: Build Intel release targeting Catalina
        if: matrix.flavor == 'macos-intel-10.15'
        run: cargo build --locked --release -p shoopdaloop --no-default-features --features native-fx --target x86_64-apple-darwin
      - name: Package portable Catalina distribution
        if: matrix.flavor == 'macos-intel-10.15'
        run: |
          python3 src/rust/shoopdaloop/package_artifacts.py native \
            --platform macos --arch x86_64 --profile release --macos-minimum-version 10.15 \
            --binary target/x86_64-apple-darwin/release/shoopdaloop \
            --carla-runtime .carla-component --output-dir artifacts
          package=$(find artifacts -name '*.tar.gz' -type f)
          destination="artifacts/shoopdaloop-macos-x86_64-10.15-without-cpal-release-dev-$(git rev-parse --short=8 HEAD).tar.gz"
          mv "$package" "$destination"
          echo "SHOOP_ARTIFACT=$destination" >> "$GITHUB_ENV"
      - name: Probe extracted application and bundled Carla
        if: matrix.flavor == 'macos-intel-10.15'
        run: |
          destination="$RUNNER_TEMP/Shoop Δ Catalina"
          mkdir -p "$destination"
          tar -xzf "$SHOOP_ARTIFACT" -C "$destination"
          app="$destination/shoopdaloop/ShoopDaLoop.app/Contents/MacOS/shoopdaloop"
          cd "$RUNNER_TEMP"
          env -u SHOOP_CARLA_NATIVE_LIBRARY -u SHOOP_CARLA_RESOURCE_DIR "$app" --probe-builtins
          env -u SHOOP_CARLA_NATIVE_LIBRARY -u SHOOP_CARLA_RESOURCE_DIR "$app" --probe-carla-native \
            | grep '/Frameworks/carla-runtime/lib/libcarla_native-plugin.dylib'
          env -u SHOOP_CARLA_NATIVE_LIBRARY -u SHOOP_CARLA_RESOURCE_DIR "$app" --probe-carla-native-ui
          sleep 1
          ! pgrep -f '[/]carla-plugin(-patchbay)?( |$)'
      - name: Upload portable Catalina distribution
        if: matrix.flavor == 'macos-intel-10.15'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.SHOOP_ARTIFACT }}
          archive: false
          retention-days: 30
          if-no-files-found: error
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: nextest@0.9.116
      - name: Test CPAL-free workspace
        if: runner.os == 'Linux'
        env:
          SHOOP_ALLOW_MISSING_BACKENDS: "1"
        run: cargo nextest run --locked --workspace --no-default-features --features shoopdaloop/native-fx,shoop_engine/app_backend --profile ci
      - name: Upload compatibility diagnostics
        if: always() && matrix.flavor == 'macos-intel-10.15'
        uses: actions/upload-artifact@v7
        with:
          name: macos-catalina-compatibility-${{ github.run_id }}
          path: |
            carla-compatibility.txt
            dependency-tree.txt
          if-no-files-found: ignore
          retention-days: 14

  build_and_test:
    if: github.event_name != 'workflow_dispatch' || inputs.nightly_flavor == 'none'
    name: ${{ matrix.target }} ${{ matrix.arch }} ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
            arch: x86_64
            profile: debug
            cargo_args: ""
            rust_targets: ""
            binary: target/debug/shoopdaloop
            artifact: shoopdaloop-linux-x86_64-debug.tar.gz
          - target: linux
            os: ubuntu-24.04
            arch: x86_64
            profile: release
            cargo_args: --release
            rust_targets: ""
            binary: target/release/shoopdaloop
            artifact: shoopdaloop-linux-x86_64-release.tar.gz
          - target: windows
            os: windows-2025
            arch: x86_64
            profile: debug
            cargo_args: ""
            rust_targets: x86_64-pc-windows-msvc
            binary: target/debug/shoopdaloop.exe
            artifact: shoopdaloop-windows-x86_64-debug.zip
          - target: windows
            os: windows-2025
            arch: x86_64
            profile: release
            cargo_args: --release
            rust_targets: x86_64-pc-windows-msvc
            binary: target/release/shoopdaloop.exe
            artifact: shoopdaloop-windows-x86_64-release.zip
          - target: macos
            os: macos-15
            arch: arm64
            profile: debug
            cargo_args: ""
            rust_targets: aarch64-apple-darwin
            binary: target/debug/shoopdaloop
            artifact: shoopdaloop-macos-arm64-debug.tar.gz
          - target: macos
            os: macos-15
            arch: arm64
            profile: release
            cargo_args: --release
            rust_targets: aarch64-apple-darwin
            binary: target/release/shoopdaloop
            artifact: shoopdaloop-macos-arm64-release.tar.gz
          - target: web
            os: ubuntu-24.04
            arch: wasm32
            profile: debug
            cargo_args: --no-default-features
            trunk_args: ""
            rust_targets: wasm32-unknown-unknown
            artifact: shoopdaloop-web-wasm32-debug.zip
          - target: web
            os: ubuntu-24.04
            arch: wasm32
            profile: release
            cargo_args: --release --no-default-features
            trunk_args: --release
            rust_targets: wasm32-unknown-unknown
            artifact: shoopdaloop-web-wasm32-release.zip
            html_artifact: shoopdaloop-web-wasm32-release.html
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set release build identity
        if: github.ref_type == 'tag'
        shell: bash
        run: echo "SHOOP_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Rust stable
        if: env.ACT != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
          components: rustfmt

      - name: Install pinned Node.js for Wasm tests
        if: matrix.target == 'web' && env.ACT != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Install pinned wasm-pack
        if: matrix.target == 'web' && env.ACT != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Cache Rust builds
        if: env.ACT != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: app-v1
          shared-key: ${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.profile }}
          cache-targets: "true"
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-bin: ${{ matrix.target == 'web' }}
          workspaces: |
            . -> target
            tests/rt_runtime_host -> target
            tests/loops_host -> target

      - name: Check local act prerequisites
        if: env.ACT == 'true'
        run: |
          rustc --version
          cargo --version
          python3 --version
          if [ "${{ matrix.target }}" = "web" ]; then trunk --version; fi

      - name: Install cargo-nextest
        if: env.ACT != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.116

      - name: Check local cargo-nextest prerequisite
        if: env.ACT == 'true'
        run: cargo nextest --version

      - name: Configure MSVC C++ compilation for Perfetto
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command clang-cl.exe -ErrorAction Stop).Source
          "CXX=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXXFLAGS=-DNOMINMAX -D_WINSOCKAPI_ -D_CRT_SECURE_NO_WARNINGS -D_CRT_DECLARE_NONSTDC_NAMES=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux build dependencies
        if: matrix.target == 'linux' && env.ACT != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential libasound2-dev libfluidsynth-dev libgl1-mesa-dev libgtk-3-dev \
            libgtk2.0-dev libjack-jackd2-dev liblo-dev libmagic-dev libpulse-dev \
            libsndfile1-dev libx11-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libwayland-dev \
            patchelf protobuf-compiler python3-venv xvfb

      - name: Install web build and test dependencies
        if: matrix.target == 'web' && env.ACT != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libjack-jackd2-dev protobuf-compiler pulseaudio xvfb
          if ! command -v trunk >/dev/null 2>&1; then
            cargo install --locked trunk --version 0.21.14
          fi
          trunk --version

      - name: Build pinned Linux Carla runtime
        if: matrix.target == 'linux'
        run: |
          curl -L --fail --retry 3 -o carla-source.tar.gz https://github.com/falkTX/Carla/archive/refs/tags/v2.5.10.tar.gz
          echo "ae2835b12081f7271a6b0b25d34b87d36b022c40370028ca4a10f90fcedfa661  carla-source.tar.gz" | sha256sum --check
          mkdir .carla-source
          tar -xzf carla-source.tar.gz -C .carla-source --strip-components=1
          echo "c1b1a806a95ee2e4935eec9699c233e6a3ee27fcc8da37002bb0034c9d81854f  .carla-source/source/includes/CarlaNative.h" | sha256sum --check
          cc -std=c11 -I .carla-source/source/includes third_party/carla/abi_probe.c -o .carla-abi-probe
          ./.carla-abi-probe > .carla-abi.actual
          diff -u third_party/carla/abi-x86_64.expected .carla-abi.actual
          python3 -m venv .carla-venv
          .carla-venv/bin/pip install --disable-pip-version-check 'cx-Freeze==7.2.7' 'PyQt5==5.15.11'
          PATH="$PWD/.carla-venv/bin:$PATH" make -C .carla-source -j2 plugin frontend
          .carla-venv/bin/python scripts/build_carla_linux_ui.py --source .carla-source --output .carla-frozen-ui
          python3 scripts/carla_runtime.py normalize \
            --platform linux \
            --search-root .carla-source/bin \
            --search-root .carla-frozen-ui \
            --license .carla-source/doc/GPL.txt \
            --output .carla-component
          echo "SHOOP_CARLA_NATIVE_LIBRARY=$PWD/.carla-component/lib/libcarla_native-plugin.so" >> "$GITHUB_ENV"
          echo "SHOOP_CARLA_RESOURCE_DIR=$PWD/.carla-component/resources" >> "$GITHUB_ENV"

      - name: Prepare pinned Windows Carla runtime
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/falkTX/Carla/releases/download/v2.5.10/Carla-2.5.10-win64.zip" -OutFile carla-win64.zip
          $actual = (Get-FileHash carla-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "56264cd860b3e6e7b29221fb1e46d7d8a288fb001500f830bcd739ec7b115650") { throw "Carla archive checksum mismatch" }
          Expand-Archive carla-win64.zip -DestinationPath .carla-upstream
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/falkTX/Carla/v2.5.10/doc/GPL.txt" -OutFile carla-GPL.txt
          python scripts/carla_runtime.py normalize --platform windows --search-root .carla-upstream --license carla-GPL.txt --output .carla-component
          "SHOOP_CARLA_NATIVE_LIBRARY=$PWD\.carla-component\lib\libcarla_native-plugin.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHOOP_CARLA_RESOURCE_DIR=$PWD\.carla-component\resources" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify pinned Windows Carla ABI
        if: matrix.target == 'windows' && matrix.profile == 'debug'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/falkTX/Carla/archive/refs/tags/v2.5.10.tar.gz" -OutFile carla-source.tar.gz
          $actual = (Get-FileHash carla-source.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "ae2835b12081f7271a6b0b25d34b87d36b022c40370028ca4a10f90fcedfa661") { throw "Carla source checksum mismatch" }
          New-Item -ItemType Directory .carla-source | Out-Null
          tar -xzf carla-source.tar.gz -C .carla-source --strip-components=1
          $header = (Get-FileHash .carla-source/source/includes/CarlaNative.h -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($header -ne "c1b1a806a95ee2e4935eec9699c233e6a3ee27fcc8da37002bb0034c9d81854f") { throw "Carla header checksum mismatch" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -property installationPath
          $developerShell = Join-Path $visualStudio "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$developerShell`" -arch=x64 && cl /nologo /std:c11 /I.carla-source\source\includes third_party\carla\abi_probe.c /Fe:.carla-abi-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "Carla ABI probe build failed" }
          python -c "import pathlib,subprocess; expected=pathlib.Path('third_party/carla/abi-x86_64.expected').read_text(); actual=subprocess.check_output([r'.carla-abi-probe.exe'],text=True).replace('\\r\\n','\\n'); assert actual == expected, (actual,expected)"

      - name: Prepare pinned macOS Carla runtime
        if: matrix.target == 'macos'
        run: |
          curl -L --fail --retry 3 -o carla.dmg https://github.com/falkTX/Carla/releases/download/v2.5.10/Carla-2.5.10-macOS-universal.dmg
          echo "a30e98409974493ade18f598566628369fee67f179a84e1c2cc3ae46a71808b1  carla.dmg" | shasum -a 256 --check
          mkdir .carla-volume
          hdiutil attach carla.dmg -nobrowse -readonly -mountpoint .carla-volume
          curl -L --fail --retry 3 -o carla-GPL.txt https://raw.githubusercontent.com/falkTX/Carla/v2.5.10/doc/GPL.txt
          python3 scripts/carla_runtime.py normalize --platform macos --search-root .carla-volume --license carla-GPL.txt --output .carla-component
          hdiutil detach .carla-volume
          echo "SHOOP_CARLA_NATIVE_LIBRARY=$PWD/.carla-component/lib/libcarla_native-plugin.dylib" >> "$GITHUB_ENV"
          echo "SHOOP_CARLA_RESOURCE_DIR=$PWD/.carla-component/resources" >> "$GITHUB_ENV"

      - name: Verify pinned macOS Carla ABI
        if: matrix.target == 'macos' && matrix.profile == 'debug'
        run: |
          curl -L --fail --retry 3 -o carla-source.tar.gz https://github.com/falkTX/Carla/archive/refs/tags/v2.5.10.tar.gz
          echo "ae2835b12081f7271a6b0b25d34b87d36b022c40370028ca4a10f90fcedfa661  carla-source.tar.gz" | shasum -a 256 --check
          mkdir .carla-source
          tar -xzf carla-source.tar.gz -C .carla-source --strip-components=1
          echo "c1b1a806a95ee2e4935eec9699c233e6a3ee27fcc8da37002bb0034c9d81854f  .carla-source/source/includes/CarlaNative.h" | shasum -a 256 --check
          cc -std=c11 -I .carla-source/source/includes third_party/carla/abi_probe.c -o .carla-abi-probe
          ./.carla-abi-probe > .carla-abi.actual
          diff -u third_party/carla/abi-x86_64.expected .carla-abi.actual

      - name: Audit Linux Carla runtime linkage
        if: matrix.target == 'linux'
        run: |
          readelf -h .carla-component/lib/libcarla_native-plugin.so | grep 'Advanced Micro Devices X86-64'
          nm -D --defined-only .carla-component/lib/libcarla_native-plugin.so | grep 'carla_get_native_rack_plugin'
          nm -D --defined-only .carla-component/lib/libcarla_native-plugin.so | grep 'carla_get_native_patchbay_plugin'
          nm -D --defined-only .carla-component/lib/libcarla_native-plugin.so | grep 'carla_get_native_patchbay16_plugin'
          ! ldd .carla-component/lib/libcarla_native-plugin.so | grep 'not found'
          ! ldd .carla-component/resources/lib/PyQt5/Qt5/plugins/platforms/libqxcb.so | grep 'not found'
          test -n "$(patchelf --print-rpath .carla-component/lib/libcarla_native-plugin.so)"

      - name: Audit Windows Carla runtime linkage
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -property installationPath
          $developerShell = Join-Path $visualStudio "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$developerShell`" -arch=x64 && dumpbin /headers .carla-component\lib\libcarla_native-plugin.dll && dumpbin /dependents .carla-component\lib\libcarla_native-plugin.dll && dumpbin /exports .carla-component\lib\libcarla_native-plugin.dll > .carla-exports.txt"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin audit failed" }
          foreach ($symbol in @('carla_get_native_rack_plugin', 'carla_get_native_patchbay_plugin', 'carla_get_native_patchbay16_plugin')) {
            if (-not (Select-String -Quiet $symbol .carla-exports.txt)) { throw "Carla runtime is missing $symbol" }
          }

      - name: Audit macOS Carla runtime linkage
        if: matrix.target == 'macos'
        run: |
          lipo .carla-component/lib/libcarla_native-plugin.dylib -verify_arch arm64
          nm -gU .carla-component/lib/libcarla_native-plugin.dylib | grep '_carla_get_native_rack_plugin'
          nm -gU .carla-component/lib/libcarla_native-plugin.dylib | grep '_carla_get_native_patchbay_plugin'
          nm -gU .carla-component/lib/libcarla_native-plugin.dylib | grep '_carla_get_native_patchbay16_plugin'
          otool -L .carla-component/lib/libcarla_native-plugin.dylib

      - name: Build native application
        if: matrix.target != 'web'
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked -p shoopdaloop ${{ matrix.cargo_args }}

      - name: Reject a fake Carla library with missing descriptors
        if: (matrix.target == 'linux' || matrix.target == 'macos') && matrix.profile == 'debug'
        shell: bash
        run: |
          extension=so
          linker=(-shared -fPIC)
          if [ "${{ matrix.target }}" = macos ]; then
            extension=dylib
            linker=(-dynamiclib)
          fi
          cc "${linker[@]}" third_party/carla/fake_native_missing_descriptor.c -o "fake-null.$extension"
          cc "${linker[@]}" -I .carla-source/source/includes -DOMIT_PATCHBAY16 third_party/carla/fake_native_bad_descriptor.c -o "fake-symbol.$extension"
          cc "${linker[@]}" -I .carla-source/source/includes third_party/carla/fake_native_bad_descriptor.c -o "fake-descriptor.$extension"
          reject() {
            library=$1
            expected=$2
            shift 2
            if env SHOOP_CARLA_NATIVE_LIBRARY="$library" "$@" ./${{ matrix.binary }} --probe-carla-native >fake-carla.log 2>&1; then
              echo 'Invalid Carla runtime was unexpectedly accepted'
              exit 1
            fi
            grep "$expected" fake-carla.log
          }
          reject "$PWD/fake-null.$extension" 'Carla descriptor is null'
          reject "$PWD/fake-symbol.$extension" 'carla_get_native_patchbay16_plugin'
          reject "$PWD/fake-descriptor.$extension" 'incompatible port layout'
          reject "$SHOOP_CARLA_NATIVE_LIBRARY" 'must be an absolute path' SHOOP_CARLA_RESOURCE_DIR=relative
          reject "$SHOOP_CARLA_NATIVE_LIBRARY" 'is not a directory' SHOOP_CARLA_RESOURCE_DIR="$PWD/missing-resource"

      - name: Reject a fake Carla library with missing descriptors on Windows
        if: matrix.target == 'windows' && matrix.profile == 'debug'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -property installationPath
          $developerShell = Join-Path $visualStudio "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$developerShell`" -arch=x64 && cl /nologo /LD third_party\carla\fake_native_missing_descriptor.c /link /OUT:fake-null.dll && cl /nologo /std:c11 /LD /DOMIT_PATCHBAY16 /I.carla-source\source\includes third_party\carla\fake_native_bad_descriptor.c /link /OUT:fake-symbol.dll && cl /nologo /std:c11 /LD /I.carla-source\source\includes third_party\carla\fake_native_bad_descriptor.c /link /OUT:fake-descriptor.dll"
          if ($LASTEXITCODE -ne 0) { throw "fake Carla build failed" }
          @'
          import os
          import subprocess
          from pathlib import Path
          binary = r"${{ matrix.binary }}"
          real = os.environ["SHOOP_CARLA_NATIVE_LIBRARY"]
          cases = [
              (str(Path("fake-null.dll").resolve()), None, "Carla descriptor is null"),
              (str(Path("fake-symbol.dll").resolve()), None, "GetProcAddress failed"),
              (str(Path("fake-descriptor.dll").resolve()), None, "incompatible port layout"),
              (real, "relative", "must be an absolute path"),
              (real, str(Path("missing-resource").resolve()), "is not a directory"),
          ]
          for library, resource, expected in cases:
              environment = os.environ.copy()
              environment["SHOOP_CARLA_NATIVE_LIBRARY"] = library
              if resource is not None:
                  environment["SHOOP_CARLA_RESOURCE_DIR"] = resource
              process = subprocess.run([binary, "--probe-carla-native"], env=environment, capture_output=True, text=True)
              output = process.stdout + process.stderr
              assert process.returncode != 0, f"invalid Carla accepted: {library}"
              assert expected in output, (expected, output)
          '@ | python -

      - name: Probe normalized Carla Native runtime
        if: matrix.target != 'web' && matrix.target != 'windows'
        shell: bash
        run: ./${{ matrix.binary }} --probe-carla-native

      - name: Probe normalized Carla Native runtime on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          & ".\\${{ matrix.binary }}" --probe-carla-native
          if ($LASTEXITCODE -ne 0) { throw "Carla Native probe failed with exit code $LASTEXITCODE" }

      - name: Build web application
        if: matrix.target == 'web'
        working-directory: src/rust/shoopdaloop
        env:
          RUSTFLAGS: -D warnings
        run: trunk build ${{ matrix.trunk_args }}

      - name: Package native application
        if: matrix.target != 'web'
        run: >-
          python3 src/rust/shoopdaloop/package_artifacts.py native
          --platform ${{ matrix.target }}
          --arch ${{ matrix.arch }}
          --profile ${{ matrix.profile }}
          --binary ${{ matrix.binary }}
          --carla-runtime .carla-component
          --output-dir artifacts

      - name: Package web application
        if: matrix.target == 'web'
        run: >-
          python3 src/rust/shoopdaloop/package_artifacts.py web
          --profile ${{ matrix.profile }}
          --dist src/rust/shoopdaloop/dist
          --output-dir artifacts

      - name: Record identified artifact paths
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          artifacts = [path for path in Path("artifacts").iterdir() if path.is_file()]
          archives = [path for path in artifacts if path.suffix != ".html"]
          html = [path for path in artifacts if path.suffix == ".html"]
          if len(archives) != 1:
              raise RuntimeError(f"expected one packaged archive, found: {archives}")
          if os.environ["TARGET"] == "web" and os.environ["PROFILE"] == "release" and len(html) != 1:
              raise RuntimeError(f"expected one release HTML file, found: {html}")
          if os.environ["TARGET"] == "web" and os.environ["PROFILE"] == "debug" and html:
              raise RuntimeError(f"unexpected debug HTML files: {html}")
          if os.environ["TARGET"] != "web" and html:
              raise RuntimeError(f"unexpected packaged HTML files: {html}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"SHOOP_ARTIFACT={archives[0].resolve()}\n")
              if html:
                  environment.write(f"SHOOP_HTML_ARTIFACT={html[0].resolve()}\n")
          PY

      - name: Upload native application
        if: matrix.target != 'web' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.SHOOP_ARTIFACT }}
          archive: false

      - name: Upload hosted web bundle
        if: matrix.target == 'web' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.SHOOP_ARTIFACT }}
          archive: false

      - name: Upload core-only single-file web application
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.html_artifact }}
          path: ${{ env.SHOOP_HTML_ARTIFACT }}
          archive: false

      - name: Stage application artifacts for local act
        if: env.ACT == 'true'
        run: |
          test -s "$SHOOP_ARTIFACT"
          if [ "${{ matrix.target }}" = "web" ] && [ "${{ matrix.profile }}" = "release" ]; then
            test -s "$SHOOP_HTML_ARTIFACT"
          fi
          ls -lh artifacts

      # Tests deliberately follow artifact upload so failed tests leave a build to inspect.
      - name: Verify native application archive
        if: matrix.target != 'web'
        run: >-
          python3 src/rust/shoopdaloop/package_artifacts.py verify
          --platform ${{ matrix.target }}
          --artifact "$SHOOP_ARTIFACT"

      - name: Probe extracted Linux application archive
        if: matrix.target == 'linux'
        shell: bash
        run: |
          destination="$RUNNER_TEMP/Shoop Δ ${{ matrix.profile }}"
          mkdir -p "$destination"
          tar -xzf "$SHOOP_ARTIFACT" -C "$destination"
          app="$destination/shoopdaloop/shoopdaloop"
          env -u SHOOP_CARLA_NATIVE_LIBRARY -u SHOOP_CARLA_RESOURCE_DIR \
            "$app" --probe-carla-native \
            | grep '/carla-runtime/lib/libcarla_native-plugin.so'
          ! pgrep -f '[/]carla-plugin(-patchbay)?( |$)'
          xvfb-run -a env -u SHOOP_CARLA_NATIVE_LIBRARY -u SHOOP_CARLA_RESOURCE_DIR \
            "$app" --probe-carla-native-ui
          sleep 1
          ! pgrep -f '[/]carla-plugin(-patchbay)?( |$)'

      - name: Probe extracted macOS application archive
        if: matrix.target == 'macos'
        shell: bash
        run: |
          destination="$RUNNER_TEMP/Shoop Δ ${{ matrix.profile }}"
          mkdir -p "$destination"
          tar -xzf "$SHOOP_ARTIFACT" -C "$destination"
          app="$destination/shoopdaloop/ShoopDaLoop.app/Contents/MacOS/shoopdaloop"
          env -u SHOOP_CARLA_NATIVE_LIBRARY -u SHOOP_CARLA_RESOURCE_DIR \
            "$app" --probe-carla-native \
            | grep '/Frameworks/carla-runtime/lib/libcarla_native-plugin.dylib'
          env -u SHOOP_CARLA_NATIVE_LIBRARY -u SHOOP_CARLA_RESOURCE_DIR \
            "$app" --probe-carla-native-ui
          sleep 1
          ! pgrep -f '[/]carla-plugin(-patchbay)?( |$)'

      - name: Probe extracted Windows application archive
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Shoop Δ ${{ matrix.profile }}"
          Expand-Archive $env:SHOOP_ARTIFACT -DestinationPath $destination
          $shortRoot = Join-Path $env:RUNNER_TEMP "shoop-carla-ui-${{ matrix.profile }}"
          cmd /c "mklink /J `"$shortRoot`" `"$destination`""
          if ($LASTEXITCODE -ne 0) { throw "Could not create ASCII Carla UI test junction" }
          $application = "$shortRoot\shoopdaloop\shoopdaloop.exe"
          Remove-Item Env:SHOOP_CARLA_NATIVE_LIBRARY
          Remove-Item Env:SHOOP_CARLA_RESOURCE_DIR
          $output = & $application --probe-carla-native
          if ($LASTEXITCODE -ne 0) { throw "Extracted Carla probe failed with exit code $LASTEXITCODE" }
          if ($output -notmatch 'carla-runtime\\lib\\libcarla_native-plugin.dll') { throw "Extracted probe did not load bundled Carla: $output" }
          $env:SHOOP_CARLA_NATIVE_LIBRARY = "$shortRoot\shoopdaloop\carla-runtime\lib\libcarla_native-plugin.dll"
          $env:SHOOP_CARLA_RESOURCE_DIR = "$shortRoot\shoopdaloop\carla-runtime\resources"
          $uiHelper = "$env:SHOOP_CARLA_RESOURCE_DIR\carla-plugin.exe"
          $helper = Start-Process -FilePath $uiHelper -PassThru
          Start-Sleep -Seconds 2
          if ($helper.HasExited) { throw "Extracted Carla UI helper exited immediately with $($helper.ExitCode)" }
          Stop-Process -Id $helper.Id -Force
          Start-Sleep -Seconds 1
          $leaked = Get-Process | Where-Object { $_.ProcessName -like 'carla-plugin*' }
          if ($leaked) { throw "Leaked Carla UI helpers: $($leaked.ProcessName -join ', ')" }

      - name: Test native application path
        if: matrix.target != 'web' && (matrix.target != 'linux' || matrix.profile != 'debug')
        env:
          RUSTFLAGS: -D warnings
          SHOOP_ALLOW_MISSING_BACKENDS: 1
          SHOOP_TEST_TRACE: failure
          SHOOP_TEST_TRACE_DIR: ${{ runner.temp }}/perfetto-nextest-${{ matrix.target }}-${{ matrix.profile }}
        shell: bash
        run: |
          mkdir -p "$SHOOP_TEST_TRACE_DIR"
          cargo nextest run --locked ${{ matrix.cargo_args }} --profile ci \
            -p shoop_app_api \
            -p shoop_engine \
            -p shoop_backend \
            -p shoop_app \
            -p shoop_egui \
            -p shoopdaloop \
            -p shoop_rt_protocol \
            -p shoop_rt_engine \
            -p shoop_rt_backend \
            -p shoop_rt_host_native \
            -p shoop_rt_host_worklet

      - name: Test complete retained workspace
        if: matrix.target == 'linux' && matrix.profile == 'debug'
        env:
          RUSTFLAGS: -D warnings
          SHOOP_ALLOW_MISSING_BACKENDS: 1
          SHOOP_REQUIRE_CARLA_TESTS: 1
          SHOOP_TEST_TRACE: failure
          SHOOP_TEST_TRACE_DIR: ${{ runner.temp }}/perfetto-nextest-${{ matrix.target }}-${{ matrix.profile }}
        run: |
          mkdir -p "$SHOOP_TEST_TRACE_DIR"
          cargo nextest run --locked --workspace --features shoop_engine/app_backend --profile ci

      - name: Test independent runtime, loop library and native hosts
        if: matrix.target != 'web'
        env:
          RUSTFLAGS: -D warnings
        shell: bash
        run: |
          cargo test --locked -p rt_runtime -p shoop_loops ${{ matrix.cargo_args }}
          cargo test --locked --manifest-path tests/loops_host/Cargo.toml ${{ matrix.cargo_args }}
          cargo fmt --manifest-path tests/loops_host/Cargo.toml -- --check
          cargo run --locked -p rt_runtime ${{ matrix.cargo_args }} --example gain_graph
          cargo run --locked -p rt_runtime ${{ matrix.cargo_args }} --example planned_pair
          cargo run --locked -p rt_runtime ${{ matrix.cargo_args }} --example pending_operations
          cargo run --locked -p shoop_loops ${{ matrix.cargo_args }} --example coordinated_loop
          python3 scripts/run_rt_runtime_hosts.py --native-only --profile '${{ matrix.profile }}'
          python3 scripts/run_loops_hosts.py --native-only --profile '${{ matrix.profile }}'
          python3 scripts/check_rt_runtime_boundary.py
          python3 scripts/check_loops_boundary.py
          python3 scripts/check_rt_engine_boundary.py
          python3 -m unittest scripts.tests.test_rt_runtime_boundary scripts.tests.test_loops_boundary scripts.tests.test_rt_engine_boundary

      - name: Measure guarded rt_runtime release workloads
        if: matrix.target == 'linux' && matrix.profile == 'release'
        env:
          RUSTFLAGS: -D warnings
        run: python3 scripts/benchmark_rt_runtime.py --iterations 4096 --trials 1

      - name: Measure guarded loop release workloads
        if: matrix.target == 'linux' && matrix.profile == 'release'
        env:
          RUSTFLAGS: -D warnings
          RUSTDOCFLAGS: -D warnings
        run: |
          python3 scripts/benchmark_loops.py --iterations 1024 --trials 3 \
            --report-dir '${{ runner.temp }}/loops-bench-${{ github.run_id }}-${{ github.run_attempt }}'

      - name: Upload guarded loop measurement evidence
        if: always() && matrix.target == 'linux' && matrix.profile == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: loops-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loops-bench-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload rt_runtime native and benchmark evidence
        if: always() && matrix.target != 'web'
        uses: actions/upload-artifact@v7
        with:
          name: rt-runtime-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            target/rt-runtime-host/reports
            target/rt-runtime-bench
          if-no-files-found: warn
          retention-days: 14

      - name: Upload independent loop native replay evidence
        if: always() && matrix.target != 'web'
        uses: actions/upload-artifact@v7
        with:
          name: loop-host-native-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_id }}
          path: target/loops-host/reports/native-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test Carla benchmarks
        if: matrix.target == 'linux' && matrix.profile == 'release'
        env:
          SHOOP_BENCHMARK_SMOKE: 1
        run: |
          cargo run --locked --release -p shoop_engine --features carla --example carla_inprocess_benchmark
          cargo run --locked --release -p shoop_engine --features carla --example carla_bridge_benchmark -- "./${{ matrix.binary }}" all
          cargo run --locked --release -p shoop_engine --features carla --example carla_bridge_benchmark -- "./${{ matrix.binary }}" reference

      - name: Run real Carla runtime suite on macOS
        if: matrix.target == 'macos' && matrix.profile == 'debug'
        env:
          RUSTFLAGS: -D warnings
          SHOOP_REQUIRE_CARLA_TESTS: 1
          SHOOP_TEST_TRACE: failure
          SHOOP_TEST_TRACE_DIR: ${{ runner.temp }}/perfetto-nextest-${{ matrix.target }}-${{ matrix.profile }}
        run: >-
          cargo nextest run --locked -p shoop_engine --features carla --profile ci
          -E 'test(=carla_native::tests::probes_and_runs_installed_carla_when_available)'

      - name: Run real Carla runtime and worker suites on Windows
        if: matrix.target == 'windows' && matrix.profile == 'debug'
        env:
          RUSTFLAGS: -D warnings
          SHOOP_REQUIRE_CARLA_TESTS: 1
          SHOOP_TEST_TRACE: failure
          SHOOP_TEST_TRACE_DIR: ${{ runner.temp }}/perfetto-nextest-${{ matrix.target }}-${{ matrix.profile }}
        shell: pwsh
        run: |
          cargo nextest run --locked -p shoop_engine --features carla --profile ci -E 'test(=carla_native::tests::probes_and_runs_installed_carla_when_available)'
          if ($LASTEXITCODE -ne 0) { throw "real Carla engine suite failed" }
          cargo nextest run --locked -p shoopdaloop --test carla_worker_entry --profile ci -E 'test(=application_worker_hosts_the_real_carla_native_runtime_when_available)'
          if ($LASTEXITCODE -ne 0) { throw "real Carla worker suite failed" }

      - name: Audit native feature and dependency isolation
        if: matrix.target == 'linux' && matrix.profile == 'debug'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked -p shoop_engine --no-default-features
          cargo check --locked -p shoop_engine --features carla
          cargo check --locked -p shoop_engine
          cargo check --locked -p shoopdaloop --no-default-features
          cargo check --locked -p shoop_rt_host_native --no-default-features
          cargo tree -p shoop_engine --no-default-features > /tmp/engine-minimal-tree.txt
          cargo tree -p shoop_engine --features carla > /tmp/engine-carla-tree.txt
          cargo tree -p shoop_rt_host_native --no-default-features > /tmp/rt-host-dummy-tree.txt
          if grep -E '(^| )((lilv|lv2_raw) v)' /tmp/engine-carla-tree.txt; then exit 1; fi
          if grep -E '(^| )((lilv|lv2_raw|libloading|rfd) v)' /tmp/engine-minimal-tree.txt; then exit 1; fi
          if grep -E '(^| )((cpal|midir|jack) v)' /tmp/rt-host-dummy-tree.txt; then exit 1; fi
          if rg -i 'CarlaLv2Host|lv2_carla|feature = "lv2"|shoop_engine/lv2|LV2_PATH' Cargo.toml Cargo.lock src/rust INSTALL.md README.md docs scripts third_party/carla --glob '!src/rust/shoop_engine/test_data/**'; then exit 1; fi

      - name: Smoke-test bundled Carla external UI
        if: matrix.target == 'linux' && env.ACT != 'true'
        env:
          RUSTFLAGS: -D warnings
          SHOOP_TEST_CARLA_UI: 1
          SHOOP_TEST_TRACE: failure
          SHOOP_TEST_TRACE_DIR: ${{ runner.temp }}/perfetto-nextest-${{ matrix.target }}-${{ matrix.profile }}
        run: |
          ! pgrep -f '[/]carla-plugin(-patchbay)?( |$)'
          xvfb-run -a cargo nextest run --locked ${{ matrix.cargo_args }} -p shoop_engine --features carla --profile ci -E 'test(=carla_native::tests::shows_and_hides_carla_ui_when_opted_in)'
          sleep 1
          ! pgrep -f '[/]carla-plugin(-patchbay)?( |$)'

      - name: Run intentional Perfetto failure-capture canary
        if: matrix.target == 'linux' && matrix.profile == 'debug' && inputs.perfetto_failure_canary
        env:
          SHOOP_TEST_TRACE: failure
          SHOOP_TEST_TRACE_DIR: ${{ runner.temp }}/perfetto-nextest-canary
        shell: bash
        run: |
          rm -rf "$SHOOP_TEST_TRACE_DIR"
          mkdir -p "$SHOOP_TEST_TRACE_DIR"
          set +e
          cargo nextest run --locked -p shoop_common --test nextest_capture_smoke \
            --profile ci --run-ignored ignored-only \
            -E 'test(intentional_failure_publishes_trace)' \
            > "$RUNNER_TEMP/perfetto-nextest-canary.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/perfetto-nextest-canary.log"
          test "$status" -ne 0
          grep 'intentional nextest capture smoke failure' "$RUNNER_TEMP/perfetto-nextest-canary.log"
          mapfile -t traces < <(find "$SHOOP_TEST_TRACE_DIR" -maxdepth 1 -name '*.pftrace' -type f)
          test "${#traces[@]}" -eq 1
          if find "$SHOOP_TEST_TRACE_DIR" -name '*.partial' -print -quit | grep -q .; then
            echo "unexpected partial Perfetto trace" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/perfetto-canary.sql" <<'SQL'
          SELECT name FROM slice WHERE name IN (
            'shoop.nextest_capture.smoke.zone',
            'shoop.nextest_capture.smoke.tracing_span'
          ) ORDER BY name;
          SELECT display_value FROM args WHERE display_value IN (
            'shoop.nextest_capture.smoke.tracing_event',
            'shoop.nextest_capture.smoke.log_event'
          ) ORDER BY display_value;
          SELECT t.name, c.value FROM counter c JOIN counter_track t ON c.track_id = t.id
            WHERE t.name = 'shoop.test_capture.smoke.plot' AND c.value = 42;
          SQL
          scripts/trace_processor --query-file "$RUNNER_TEMP/perfetto-canary.sql" \
            "${traces[0]}" | tee "$RUNNER_TEMP/perfetto-canary-query.txt"
          grep 'shoop.nextest_capture.smoke.zone' "$RUNNER_TEMP/perfetto-canary-query.txt"
          grep 'shoop.nextest_capture.smoke.tracing_span' "$RUNNER_TEMP/perfetto-canary-query.txt"
          grep 'shoop.nextest_capture.smoke.tracing_event' "$RUNNER_TEMP/perfetto-canary-query.txt"
          grep 'shoop.nextest_capture.smoke.log_event' "$RUNNER_TEMP/perfetto-canary-query.txt"
          grep 'shoop.test_capture.smoke.plot' "$RUNNER_TEMP/perfetto-canary-query.txt"

      - name: Check formatting, tracing, and test attributes
        if: matrix.target == 'linux' && matrix.profile == 'debug'
        run: |
          cargo fmt --all -- --check
          python3 scripts/check_tracing_coverage.py --require-closed
          python3 scripts/check_shoop_test_usage.py
          python3 -m unittest scripts.tests.test_rt_runtime_miri scripts.tests.test_rt_runtime_miri_jobs scripts.tests.test_rt_runtime_miri_batches scripts.tests.test_loops_hosts scripts.tests.test_loop_host_native_runner scripts.tests.test_loop_benchmark

      - name: Validate native and multirealm Perfetto traces
        if: matrix.target == 'linux' && matrix.profile == 'debug'
        env:
          RUSTFLAGS: -D warnings
        run: python3 scripts/validate_perfetto_traces.py

      - name: Verify web application artifacts
        if: matrix.target == 'web'
        run: |
          args=(--platform web --artifact "$SHOOP_ARTIFACT")
          if [ -n "${SHOOP_HTML_ARTIFACT:-}" ]; then
            args+=(--html "$SHOOP_HTML_ARTIFACT")
          fi
          python3 src/rust/shoopdaloop/package_artifacts.py verify "${args[@]}"

      - name: Check WebAssembly packages
        if: matrix.target == 'web'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked ${{ matrix.cargo_args }} -p shoopdaloop --target wasm32-unknown-unknown
          cargo build --locked ${{ matrix.cargo_args }} -p shoop_audio_worklet --target wasm32-unknown-unknown
          cargo build --locked ${{ matrix.cargo_args }} -p shoop_rt_host_worklet --target wasm32-unknown-unknown

      - name: Inspect browser dependency isolation
        if: matrix.target == 'web'
        run: |
          cargo tree -p shoop_audio_worklet --target wasm32-unknown-unknown > /tmp/worklet-tree.txt
          cargo tree -p shoop_rt_host_worklet --target wasm32-unknown-unknown > /tmp/rt-worklet-tree.txt
          cargo tree -p shoopdaloop --target wasm32-unknown-unknown --no-default-features > /tmp/browser-tree.txt
          python3 scripts/check_worklet_client_dependencies.py --target wasm32-unknown-unknown
          if grep -E '(^| )((cpal|midir|jack|lilv|lv2_raw|firewheel) v)' /tmp/worklet-tree.txt; then exit 1; fi
          if grep -E '(^| )((cpal|midir|jack|lilv|lv2_raw|firewheel) v)' /tmp/rt-worklet-tree.txt; then exit 1; fi
          if grep -E '(^| )((cpal|midir|jack|lilv|lv2_raw|firewheel) v)' /tmp/browser-tree.txt; then exit 1; fi
          node -e "const fs=require('fs'); const m=new WebAssembly.Module(fs.readFileSync('src/rust/shoopdaloop/dist/generated/shoop_audio_worklet.wasm')); if (WebAssembly.Module.imports(m).length) throw new Error('worklet Wasm has imports')"
          node src/rust/shoopdaloop/raw_wasm_host_contract.mjs src/rust/shoopdaloop/dist/generated/shoop_audio_worklet.wasm
          node src/rust/shoopdaloop/rt_worklet_contract.mjs src/rust/shoopdaloop/dist/generated/shoop_rt_host_worklet.wasm

      - name: Audit Wasm harness policy and dependencies
        if: matrix.target == 'web' && matrix.profile == 'debug' && env.ACT != 'true'
        run: |
          python3 -m unittest scripts.tests.test_wasm_test_report
          python3 scripts/check_wasm_test_dependencies.py \
            --package rt_runtime --package shoop_loops --package shoop_app --package shoop_app_api \
            --package shoop_audio_protocol --package shoop_audio_worklet \
            --package shoop_backend --package shoop_egui --package shoop_engine \
            --package shoop_engine_service --package shoop_example_dsp --package shoop_latency \
            --package shoop_plugin_protocol --package shoop_rt_backend --package shoop_rt_engine \
            --package shoop_rt_host_worklet --package shoop_rt_protocol --package shoop_scripting \
            --package shoop_session --package shoop_settings \
            --package shoop_wasm_runtime_tests --package shoop_wasm_test_support \
            --package shoop_worklet_client --package shoopdaloop

      - name: Run required Node Wasm suite
        if: matrix.target == 'web' && matrix.profile == 'debug' && env.ACT != 'true'
        env:
          RUSTFLAGS: -D warnings
        run: python3 scripts/run_wasm_tests.py --profile dev --runtime node

      - name: Run intentional Node Perfetto failure canaries
        if: >-
          matrix.target == 'web' && matrix.profile == 'debug' && env.ACT != 'true' &&
          inputs.perfetto_failure_canary
        shell: bash
        run: |
          printf '%s\n' \
            "SELECT name FROM slice WHERE name = 'shoop.wasm_test_capture.span';" \
            "SELECT string_value FROM args WHERE key = 'debug.phase' AND string_value = 'failure';" \
            "SELECT t.name, c.value FROM counter c JOIN counter_track t ON c.track_id = t.id WHERE t.name LIKE '%shoop.wasm_test_capture.plot';" \
            > "$RUNNER_TEMP/perfetto-wasm-canary.sql"
          for canary in \
            shared_failure_canary_is_ignored_by_default \
            shared_result_failure_canary_is_ignored_by_default; do
            set +e
            python3 scripts/run_wasm_tests.py --profile dev --runtime node \
              --package shoop_wasm_test_support \
              --feature wasm-test-failure-canary \
              --filter "$canary" \
              --trace failure
            status=$?
            set -e
            test "$status" -ne 0
            trace=$(find "target/wasm-tests/dev/reports/node/traces" \
              -name '*.pftrace' -type f -print -quit)
            test -n "$trace"
            scripts/trace_processor --query-file "$RUNNER_TEMP/perfetto-wasm-canary.sql" \
              "$trace" | tee "$RUNNER_TEMP/perfetto-wasm-node-$canary-query.txt"
            grep 'shoop.wasm_test_capture.span' \
              "$RUNNER_TEMP/perfetto-wasm-node-$canary-query.txt"
            grep 'failure' "$RUNNER_TEMP/perfetto-wasm-node-$canary-query.txt"
            grep 'shoop.wasm_test_capture.plot' \
              "$RUNNER_TEMP/perfetto-wasm-node-$canary-query.txt"
          done

      - name: Run optimized nightly/manual Node Wasm suite
        if: >-
          matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          RUSTFLAGS: -D warnings
        run: python3 scripts/run_wasm_tests.py --profile ci --runtime node

      - name: Upload Wasm test reports
        if: always() && matrix.target == 'web' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-reports-${{ matrix.profile }}-${{ github.run_id }}
          path: target/wasm-tests/*/reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Check independent runtime host formatting and boundary
        if: matrix.target == 'web' && matrix.profile == 'debug' && env.ACT != 'true'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --manifest-path tests/rt_runtime_host/Cargo.toml -- --check
          python3 scripts/check_rt_runtime_boundary.py

      - name: Check independent loop host formatting and boundary
        if: matrix.target == 'web' && env.ACT != 'true'
        env:
          RUSTFLAGS: -D warnings
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --manifest-path tests/loops_host/Cargo.toml -- --check
          python3 scripts/check_loops_boundary.py
          python3 scripts/check_rt_engine_boundary.py

      - name: Start virtual Firefox audio output
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=shoop_ci
          pactl set-default-sink shoop_ci
          pactl info

      - name: Install Firefox browser
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        uses: browser-actions/setup-firefox@v1

      - name: Install geckodriver
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Selenium
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        run: python3 -m pip install selenium

      - name: Run Firefox Web Audio workflow
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        working-directory: src/rust/shoopdaloop
        run: xvfb-run -a python3 browser_firefox_smoke.py

      - name: Upload Perfetto validation traces
        if: >-
          always() && env.ACT != 'true' && matrix.target == 'linux' && matrix.profile == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: perfetto-validation-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_id }}
          path: target/perfetto-validation/*.pftrace
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Perfetto failure captures
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: perfetto-nextest-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ github.run_id }}
          path: ${{ runner.temp }}/perfetto-nextest-*/*.pftrace
          if-no-files-found: ignore
          retention-days: 14

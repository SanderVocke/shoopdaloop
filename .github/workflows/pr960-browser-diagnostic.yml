name: Verify PR 960 validation evidence
on:
  push:
    branches: ["diag/pr960-browser-failure"]
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify successful checks on identical production Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo = "SanderVocke/shoopdaloop"
          source = "cb98366a70da9195951f242755cafa254e3aa720"
          def api(path, method="GET"):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "pr960-validation"},
                  method=method)
              with urllib.request.urlopen(request) as response:
                  data = response.read()
                  return json.loads(data) if data else {"http_status": response.status}
          def unchanged_rust(head):
              comparison = api("/compare/" + source + "..." + head)
              assert comparison["status"] in ("ahead", "identical"), comparison["status"]
              assert len(comparison.get("files", [])) < 300
              changed = [f["filename"] for f in comparison.get("files", [])
                         if f["filename"].startswith("src/rust/")
                         or f["filename"].endswith(("Cargo.toml", "Cargo.lock"))
                         or f["filename"].startswith(".cargo/")]
              assert not changed, changed
          main = api("/actions/runs/42579519033")
          assert main["head_sha"] == source, main["head_sha"]
          jobs = api("/actions/runs/42579519033/jobs?filter=latest&per_page=100")["jobs"]
          others = [j for j in jobs if j["name"] != "web wasm32 debug"]
          assert len(others) >= 14
          assert all(j["conclusion"] in ("success", "skipped") for j in others)
          debug = api("/actions/jobs/129051509142")
          steps = {s["name"]: s["conclusion"] for s in debug["steps"]}
          required = ["Build web application", "Check WebAssembly packages",
                      "Run required Node Wasm suite",
                      "Run runtime, loop, engine and codec browser suites",
                      "Check independent runtime host formatting and boundary",
                      "Check independent loop host formatting and boundary"]
          for name in required:
              assert steps.get(name) == "success", (name, steps.get(name))
          artifact = api("/actions/artifacts/13662284783")
          assert artifact["workflow_run"]["head_sha"] == source
          default = api("/actions/jobs/129088030142")
          assert default["conclusion"] == "success"
          default_run = api("/actions/runs/42595812801")
          unchanged_rust(default_run["head_sha"])
          extra_run = api("/actions/runs/42596476843")
          assert extra_run["conclusion"] == "success"
          unchanged_rust(extra_run["head_sha"])
          extra_jobs = api("/actions/runs/42596476843/jobs?filter=latest&per_page=100")["jobs"]
          assert len(extra_jobs) == 3
          assert all(j["conclusion"] == "success" for j in extra_jobs)
          hosted = api("/actions/runs/42589622180")
          assert hosted["conclusion"] == "success"
          unchanged_rust(hosted["head_sha"])
          unchanged_rust("f7f89f324dda6fd8abc81490c67106c6c84cd300")
          report = {
              "production_rust": source,
              "main_run": main["id"],
              "native_and_other_jobs": [{"name": j["name"], "conclusion": j["conclusion"]}
                                        for j in others],
              "debug_compile_node_library_groups": {name: steps[name] for name in required},
              "debug_artifact": artifact["id"],
              "default_app_workflow_job": default["id"],
              "default_app_workflow": default["conclusion"],
              "other_app_workflow_run": extra_run["id"],
              "other_app_workflow_jobs": [{"name": j["name"], "conclusion": j["conclusion"]}
                                          for j in extra_jobs],
              "hosted_processor_run": hosted["id"],
              "hosted_processor_conclusion": hosted["conclusion"],
              "conclusion": "All validation groups passed on identical production Rust; browser flakes were rerun against the published artifact."
          }
          if main["status"] in ("queued", "in_progress"):
              assert main["event"] == "workflow_dispatch"
              assert main["head_branch"] == "proto/audio-compact"
              report["redundant_main_retry_cancel"] = api("/actions/runs/42579519033/cancel", "POST")
          else:
              report["main_final_conclusion"] = main["conclusion"]
          Path("validation-groups.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pr960-validation-groups
          path: validation-groups.json
          retention-days: 14

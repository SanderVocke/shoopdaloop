name: Zynq FreeRTOS firmware
on:
  pull_request:
    branches: ["master", "feat/backend-replacement", "feat/zynq-network-deployment"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zynq-freertos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: debian:13-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    timeout-minutes: 35
    env:
      RUSTFLAGS: -D warnings
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: Install build and emulator tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git patch python3 curl xz-utils \
            build-essential pkg-config protobuf-compiler libasound2-dev libjack-jackd2-dev \
            libgl1-mesa-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev libwayland-dev \
            gcc-arm-none-eabi=15:14.2.rel1-1 binutils-arm-none-eabi=2.44-3+23+b1 \
            libnewlib-arm-none-eabi=4.5.0.20241231-1 libnewlib-dev=4.5.0.20241231-1 \
            qemu-system-arm=1:10.0.13+ds-0+deb13u1
      - uses: actions/checkout@v7
      - name: Trust the runner checkout inside the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: armv7a-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            platforms/zynq7000/firmware -> target
      - name: Build and execute all three firmware gates
        run: python3 platforms/zynq7000/suite.py --fetch
      - name: Save firmware and execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zynq-freertos-evidence
          path: |
            platforms/zynq7000/pins.json
            work/zynq/build/*.elf
            work/zynq/build/*.map
            work/zynq/build/*.json
            work/zynq/suite/
            work/zynq/echo-test/*.json
            work/zynq/echo-test/*.log
            work/zynq/echo-canary/*.log
            work/zynq/integration/**/*.json
            work/zynq/integration/**/*.log
            work/zynq/*-test/*.json
            work/zynq/*-test/*.log
          retention-days: 14
      - name: Save network and register diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zynq-freertos-failure-diagnostics
          path: |
            work/zynq/*/*.pcap
            work/zynq/*/*.txt
            work/zynq/integration/restart/*.pcap
            work/zynq/integration/restart/*.txt
          retention-days: 3
  deployment:
    name: Zynq network deployment and SD recovery
    runs-on: ubuntu-24.04
    container: debian:13-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: Install loader, emulator and native probe build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git patch python3 python3-venv python3-dev curl xz-utils gpg \
            build-essential pkg-config protobuf-compiler libasound2-dev libjack-jackd2-dev \
            libgl1-mesa-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev libwayland-dev \
            gcc-arm-none-eabi=15:14.2.rel1-1 binutils-arm-none-eabi=2.44-3+23+b1 \
            libnewlib-arm-none-eabi=4.5.0.20241231-1 libnewlib-dev=4.5.0.20241231-1 \
            bison=2:3.8.2+dfsg-1+b2 flex=2.6.4-8.2+b4 device-tree-compiler=1.7.2-2+b1 \
            ninja-build=1.12.1-1 libglib2.0-dev=2.84.4-3~deb13u5 libslirp-dev=4.8.0-1+deb13u1 \
            libssl-dev zlib1g-dev
      - uses: actions/checkout@v7
      - name: Trust the runner checkout inside the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: armv7a-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            platforms/zynq7000/firmware -> target
      - name: Install native client coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Install matching LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Build and execute all network-deployment gates
        run: python3 platforms/zynq7000/deployment/suite.py --fetch --native-coverage
      - name: Publish real deployment client coverage
        if: github.event.pull_request.user.login != 'dependabot[bot]' && hashFiles('work/zynq/deployment-suite/evidence/native-cli-coverage.lcov') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: work/zynq/deployment-suite/evidence/native-cli-coverage.lcov
          disable_search: true
          fail_ci_if_error: true
          flags: zynq-deployment-cli
      - name: Save public deployment artifacts and execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zynq-network-deployment-evidence
          path: |
            work/zynq/deployment-suite/artifacts/
            work/zynq/deployment-suite/evidence/
            !work/zynq/deployment-suite/evidence/**/*.pcap
          retention-days: 14
      - name: Save packet diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zynq-network-deployment-failure-packets
          path: work/zynq/deployment-suite/evidence/**/*.redacted.pcap
          retention-days: 3

  usb:
    name: Zynq TinyUSB MIDI host
    runs-on: ubuntu-24.04
    container: debian:13-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: Install loader, emulator and native probe build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git patch python3 python3-venv python3-dev curl xz-utils gpg \
            build-essential gcc-multilib qemu-user pkg-config protobuf-compiler libasound2-dev libjack-jackd2-dev \
            libgl1-mesa-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev libwayland-dev \
            gcc-arm-none-eabi=15:14.2.rel1-1 binutils-arm-none-eabi=2.44-3+23+b1 \
            libnewlib-arm-none-eabi=4.5.0.20241231-1 libnewlib-dev=4.5.0.20241231-1 \
            bison=2:3.8.2+dfsg-1+b2 flex=2.6.4-8.2+b4 device-tree-compiler=1.7.2-2+b1 \
            ninja-build=1.12.1-1 libglib2.0-dev=2.84.4-3~deb13u5 libslirp-dev=4.8.0-1+deb13u1 \
            libssl-dev zlib1g-dev
      - uses: actions/checkout@v7
      - name: Trust the runner checkout inside the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: armv7a-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            platforms/zynq7000/firmware -> target
      - name: Cache the pinned USB emulator
        uses: actions/cache@v5
        with:
          path: |
            work/zynq/qemu-usb-upstream
            work/zynq/qemu-usb-build
            work/zynq/qemu-venv
          key: zynq-usb-qemu-${{ runner.arch }}-${{ hashFiles('platforms/zynq7000/pins.json', 'platforms/zynq7000/patches/qemu-*.patch', 'platforms/zynq7000/usb/qemu/*') }}
      - name: Run portable and actual FreeRTOS USB gates
        run: python3 platforms/zynq7000/usb/suite.py --fetch
      - name: Save USB firmware and simulation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zynq-usb-midi-evidence
          path: |
            platforms/zynq7000/pins.json
            work/zynq/build/host-usb.elf
            work/zynq/build/host-usb.map
            work/zynq/build/host-usb.json
            work/zynq/qemu-usb-build/shoop-build.json
            work/zynq/build/host-usb.licenses.txt
            work/zynq/usb-suite/*.log
            work/zynq/usb-suite/result.json
            work/zynq/usb-suite/*/*.log
            work/zynq/usb-suite/*/*.bin
            work/zynq/usb-suite/*/result.json
            work/zynq/usb-suite/*/command.json
            work/zynq/usb-suite/*/topology.txt
            work/zynq/usb-suite/*/machine.json
            work/zynq/usb-suite/*/registers.txt
            work/zynq/usb-suite/deployment/artifacts/
            work/zynq/usb-suite/deployment/evidence/
            !work/zynq/usb-suite/deployment/evidence/**/*.pcap
            work/zynq/usb-portable/*.log
            work/zynq/usb-portable/result.json
          retention-days: 14

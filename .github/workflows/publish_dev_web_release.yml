name: Publish Development Web Release

on:
  workflow_run:
    workflows: ["Build and Test ShoopDaLoop"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-development-web-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted publishing code
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Download release web application
        uses: actions/download-artifact@v8
        with:
          name: shoopdaloop-web-wasm32-release.zip
          path: ${{ runner.temp }}/hosted-web-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-decompress: true

      - name: Publish rolling development release
        env:
          ASSET_NAME: shoopdaloop-web-wasm32-release.zip
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: dev-web
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: >-
          bash .github/scripts/publish_dev_web_release.sh
          "${{ runner.temp }}/hosted-web-release"

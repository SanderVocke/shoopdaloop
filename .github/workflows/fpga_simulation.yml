name: RT backend benchmarks
run-name: RT benchmark · ${{ inputs.variant }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Benchmark coverage and runtime
        type: choice
        required: true
        default: tiny
        options: [tiny, quick, full]

permissions:
  contents: read

concurrency:
  group: rt-benchmark-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ inputs.variant }} · 64 loops · audio, MIDI and combined
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      BENCH_VARIANT: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rt-benchmark-release
          cache-on-failure: true
      - name: Install simulation and reporting tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf flex bison libfl-dev zlib1g-dev g++ cmake patch python3-venv \
            libasound2-dev libjack-jackd2-dev
          python3 -m venv .venv
          .venv/bin/pip install 'matplotlib>=3.9,<4'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache Verilator 5.032
        id: verilator
        uses: actions/cache@v4
        with:
          path: work/verilator
          key: verilator-8ff77e9d47351b0a59114929880687839a51840b-ubuntu-24.04
      - name: Build Verilator 5.032
        if: steps.verilator.outputs.cache-hit != 'true'
        run: bash scripts/build_verilator.sh
      - name: Select Verilator
        run: echo "$PWD/work/verilator/bin" >> "$GITHUB_PATH"
      - name: Cache DRAMsim3 source
        uses: actions/cache@v4
        with:
          path: work/dramsim3/source
          key: rt-benchmark-dramsim3-${{ runner.os }}-${{ hashFiles('fpga/axi_memory/dramsim3.lock') }}
      - name: Build DRAMsim3
        run: python3 fpga/axi_memory/build_dramsim3.py
      - name: Cache compiled RTL models
        uses: actions/cache@v4
        with:
          path: work/rt-benchmark-model
          key: rt-benchmark-rtl-${{ runner.os }}-${{ hashFiles('fpga/**/*.sv', 'src/rust/shoop_rt_benchmark/src/rtl.rs', 'src/rust/rt_fpga_rtl/src/model.rs', 'third_party/marlin-verilator/**') }}
      - name: Run selected benchmark and generate PDF
        run: |
          set -o pipefail
          python3 scripts/benchmark_rt.py --preset "$BENCH_VARIANT" --rtl-jobs 3 \
            --host-profile --output work/rt-report 2>&1 | tee work/rt-benchmark.log
      - name: Downloadable PDF report
        id: pdf
        if: always() && hashFiles('work/rt-report/report.pdf') != ''
        uses: actions/upload-artifact@v7
        with:
          name: rt-benchmark-${{ inputs.variant }}-PDF
          path: work/rt-report/report.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Raw measurements, runtime breakdown and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rt-benchmark-${{ inputs.variant }}-data
          path: |
            work/rt-report/**
            work/rt-benchmark.log
          if-no-files-found: warn
          retention-days: 30
      - name: Link report from run summary
        if: always()
        env:
          PDF_URL: ${{ steps.pdf.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = [f"## RT benchmark: {os.environ['BENCH_VARIANT']}", ""]
          url = os.environ.get('PDF_URL')
          lines += [f"[Download the PDF report]({url})" if url else "PDF unavailable; inspect the data artifact and logs.", ""]
          lines += ["The data artifact includes JSON, callback CSV, host-phase timings and logs.",
                    "FPGA times use simulated fabric cycles at 150 MHz. Host runtime is recorded separately.", ""]
          runtime = Path('work/rt-report/runtime.json')
          if runtime.exists():
              data = json.loads(runtime.read_text())
              lines += [f"Capture and report wall time: **{data['elapsed_s'] / 60:.2f} minutes**.", "",
                        "| Phase | Host seconds |", "| --- | ---: |"]
              lines += [f"| {name} | {seconds:.2f} |" for name, seconds in data['phases_s'].items()]
          if os.environ['BENCH_VARIANT'] == 'tiny':
              lines += ["", "Tiny RTL intentionally omits playback wraps, planned transitions and mixed recording/playback."]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

name: FPGA simulation memory

on:
  pull_request:
    paths:
      - 'fpga/**'
      - 'PLAN_SIM_MEM.md'
      - 'PLAN_METADATA_CACHE.md'
      - 'PLAN_RETAKE_CLEAR.md'
      - 'AUDIO_IO.md'
      - 'scripts/rt_backend_testbench/**'
      - 'src/rust/rt_audio_math/**'
      - 'src/rust/rt_backend_testbench/**'
      - 'src/rust/rt_runtime/**'
      - 'src/rust/shoop_loops/**'
      - 'src/rust/shoop_rt_engine/**'
      - 'src/rust/rt_fpga_adapter/**'
      - 'src/rust/rt_fpga_sim/**'
      - 'src/rust/shoop_rt_host_fpga_sim/**'
      - 'src/rust/shoop_host/**'
      - 'src/rust/shoop_host_manager/**'
      - 'src/rust/shoopdaloop/**'
      - 'src/rust/shoop_app_api/**'
      - 'src/rust/shoop_rt_protocol/**'
      - 'src/rust/shoop_app_protocol/**'
      - 'src/rust/shoop_egui/**'
      - 'scripts/build_verilator.sh'
      - 'scripts/check_dependency_boundaries.py'
      - 'Cargo.lock'
      - 'PLAN_FPGA_RTL_BACKEND.md'
      - '.github/workflows/fpga_simulation.yml'
  push:
    branches: [master, proto/fpga-rust-reference]
    paths:
      - 'fpga/**'
      - 'scripts/build_verilator.sh'
      - 'src/rust/shoop_rt_host_fpga_sim/**'
      - 'src/rust/shoop_host/**'
      - 'src/rust/shoopdaloop/**'
      - '.github/workflows/fpga_simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpga-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    name: FPGA ${{ matrix.model }} memory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model: [instant, dramsim3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: production-fpga
      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf flex bison libfl-dev zlib1g-dev g++ cmake patch python3-venv
          python3 -m venv .venv
          .venv/bin/pip install -r fpga/axi_memory/requirements.txt -r scripts/rt_backend_testbench/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache Verilator 5.032
        id: verilator
        uses: actions/cache@v4
        with:
          path: work/verilator
          key: verilator-8ff77e9d47351b0a59114929880687839a51840b-ubuntu-24.04
      - name: Build Verilator 5.032
        if: steps.verilator.outputs.cache-hit != 'true'
        run: bash scripts/build_verilator.sh
      - name: Select Verilator
        run: |
          echo "$PWD/work/verilator/bin" >> "$GITHUB_PATH"
          work/verilator/bin/verilator --version
      - name: Build the realistic timing model
        if: matrix.model == 'dramsim3'
        run: python fpga/axi_memory/build_dramsim3.py
      - name: Check generated wrappers
        run: python fpga/axi_memory/generate_tops.py --check
      - name: Check native memory independently
        if: matrix.model == 'instant'
        run: |
          python fpga/axi_memory/simulate_direct.py --output work/native-ci/model
          python fpga/chunk_memory/simulate.py --config minimum --random-cases 1 --axi-data-width 64 --dram-library /missing/not-required.so --output work/native-ci/chunks
      - name: Check metadata caches and shared transport
        if: matrix.model == 'instant'
        run: python fpga/media_store/simulate_metadata.py --output work/native-ci/metadata
      - name: Check endpoints and Rust pipeline comparisons
        run: |
          python fpga/axi_memory/simulate.py --memory-model ${{ matrix.model }} --output work/native-ci/endpoints
          python fpga/media_store/simulate.py --pipeline --config small --random-cases 2 --axi-data-width 64 --memory-model ${{ matrix.model }} --output work/native-ci/audio
          python fpga/loop_pipeline/simulate.py --config odd --directed --random-cases 2 --axi-data-width 64 --memory-model ${{ matrix.model }} --output work/native-ci/loops
      - name: Check audio generated tops
        run: |
          python fpga/audio_io/generate_top.py --check
          python fpga/audio_io/generate_demo.py --check
          python fpga/audio_io/prepare_demo.py --check
      - name: Check bank ownership and quantum fences
        if: matrix.model == 'instant'
        run: |
          python fpga/audio_io/simulate.py --q 1 --banks 2 --audio-period 10 --audio-phase 3 --output work/native-ci/audio-q1
          python fpga/audio_io/simulate.py --q 3 --p 1 --output work/native-ci/audio-odd
          python fpga/audio_io/simulate.py --control --output work/native-ci/audio-control
      - name: Check autonomous ZedBoard measurement runner
        run: |
          python fpga/zedboard/generate.py --check
          python fpga/zedboard/prepare.py --loops 4 --tracks 2 --record-quanta 2 --output work/native-ci/zedboard-workload
          controls=()
          if [ "${{ matrix.model }}" = instant ]; then controls+=(--control-tests); fi
          python fpga/zedboard/simulate.py --workload work/native-ci/zedboard-workload --memory-model ${{ matrix.model }} "${controls[@]}" --output work/native-ci/zedboard-runner
      - name: Check continuous 16-channel audio
        run: |
          python fpga/audio_io/simulate_pipeline.py --p 16 --frame-cycles 1600 --memory-model ${{ matrix.model }} --axi-data-width 64 --stalls --output work/native-ci/audio-continuous
      - name: Check shallow latency and underrun recovery
        if: matrix.model == 'instant'
        run: |
          python fpga/audio_io/simulate_pipeline.py --q 16 --chunk 8 --p 8 --banks 2 --monitoring --frame-cycles 1024 --output work/native-ci/audio-shallow
          python fpga/audio_io/simulate_pipeline.py --overrun --output work/native-ci/audio-overrun
          python fpga/audio_io/simulate_pipeline.py --demo --output work/native-ci/audio-demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fpga-memory-${{ matrix.model }}
          path: |
            work/native-ci/**/*.log
            work/native-ci/**/results.xml
            work/native-ci/**/*summary.json
            work/native-ci/audio-*/*.json
            work/native-ci/audio-*/*.hex
          if-no-files-found: warn

  reclamation:
    name: Deferred reclamation (${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model: [instant, dramsim3]
    steps:
      - uses: actions/checkout@v7
      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf flex bison libfl-dev zlib1g-dev g++ cmake patch python3-venv
          python3 -m venv .venv
          .venv/bin/pip install -r fpga/axi_memory/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache Verilator 5.032
        id: verilator
        uses: actions/cache@v4
        with:
          path: work/verilator
          key: verilator-8ff77e9d47351b0a59114929880687839a51840b-ubuntu-24.04
      - name: Build Verilator 5.032
        if: steps.verilator.outputs.cache-hit != 'true'
        run: bash scripts/build_verilator.sh
      - name: Select Verilator
        run: echo "$PWD/work/verilator/bin" >> "$GITHUB_PATH"
      - name: Build the realistic timing model
        if: matrix.model == 'dramsim3'
        run: python fpga/axi_memory/build_dramsim3.py
      - name: Check detachment, maintenance, sharing and faults
        run: |
          python fpga/media_store/simulate.py --config wide --block-chunks 32 --retired-tables 2 --deferred --axi-data-width 64 --metadata-lines 1 --reference-lines 1 --stack-lines 1 --memory-model ${{ matrix.model }} --output work/reclamation/ownership
          python fpga/chunk_memory/simulate.py --config small --retire-chunks 32 --memory-model ${{ matrix.model }} --output work/reclamation/retirement
      - name: Check exhausted pools and transfer publication
        if: matrix.model == 'instant'
        run: |
          python fpga/media_store/simulate.py --config wide --block-chunks 32 --metadata-pages 3 --deferred-capacity --output work/reclamation/capacity
          python fpga/media_store/simulate.py --config wide --block-chunks 32 --retired-tables 2 --metadata-pages 7 --reuse-views --deferred-reuse --output work/reclamation/reuse
      - name: Check large arena and continued recording
        if: matrix.model == 'instant'
        run: python fpga/media_store/simulate.py --config retirement --block-chunks 32 --deferred-stress --stress-seconds 1 --metadata-lines 128 --axi-data-width 64 --output work/reclamation/stress
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.model == 'instant'
      - uses: Swatinem/rust-cache@v2
        if: matrix.model == 'instant'
        with:
          shared-key: production-fpga
      - name: Check queue-driven Marlin runtime integration
        if: matrix.model == 'instant'
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p rt_fpga_sim --features sim -- --test-threads=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deferred-reclamation-${{ matrix.model }}
          path: |
            work/reclamation/**/*.log
            work/reclamation/**/results.xml
            work/reclamation/**/*timing.json
            work/reclamation/**/stress-*.json
          if-no-files-found: warn

  audio-synthesis:
    name: Audio I/O lint and synthesis (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ contains(matrix.target, 'map') && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        target: [q16, q32, q64, map, demo, demo-map, media]
    steps:
      - uses: actions/checkout@v7
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf flex bison libfl-dev zlib1g-dev g++
      - name: Install pinned synthesis tools
        uses: YosysHQ/setup-oss-cad-suite@853bb54f52246aa8fb4fab963f104cfb6676197a # v4
        with:
          version: '2025-04-15'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report synthesis tool version
        run: yosys -V
      - name: Cache synthesis Verilator 5.032
        id: verilator
        uses: actions/cache@v4
        with:
          path: work/verilator
          key: verilator-8ff77e9d47351b0a59114929880687839a51840b-ubuntu-24.04
      - name: Build synthesis Verilator 5.032
        if: steps.verilator.outputs.cache-hit != 'true'
        run: bash scripts/build_verilator.sh
      - name: Select synthesis Verilator
        run: echo "$PWD/work/verilator/bin" >> "$GITHUB_PATH"
      - name: Check complete audio top variant
        if: startsWith(matrix.target, 'q')
        run: |
          case '${{ matrix.target }}' in
            q16) python3 fpga/audio_io/check.py --quantum 16 --generic-only ;;
            q32) python3 fpga/audio_io/check.py --quantum 32 --generic-only ;;
            q64) python3 fpga/audio_io/check.py --quantum 64 --generic-only ;;
          esac
      - name: Map complete audio top
        if: matrix.target == 'map'
        run: python3 fpga/audio_io/check.py --mapping-only
      - name: Check prepared demo inference
        if: matrix.target == 'demo'
        run: python3 fpga/audio_io/check.py --demo --generic-only --output work/audio-demo-synthesis
      - name: Map prepared demo
        if: matrix.target == 'demo-map'
        run: python3 fpga/audio_io/check.py --demo --mapping-only --output work/audio-demo-synthesis
      - name: Check media ownership synthesis
        if: matrix.target == 'media'
        run: bash fpga/media_store/check.sh work/media-synthesis
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audio-synthesis-${{ matrix.target }}
          path: |
            work/audio-synthesis/*.log
            work/audio-synthesis/*generic.json
            work/audio-synthesis/resources.json
            work/audio-demo-synthesis/*.log
            work/audio-demo-synthesis/*generic.json
            work/audio-demo-synthesis/resources.json
            work/media-synthesis/*.log
            work/media-synthesis/*ecp5.json
          if-no-files-found: warn

  rtl-host:
    name: Regular FPGA RTL host and application
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: production-fpga-host
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf flex bison libfl-dev zlib1g-dev g++ pkg-config libasound2-dev libjack-jackd2-dev libudev-dev libclang-dev libgl1-mesa-dev libx11-dev libxkbcommon-dev libwayland-dev
      - name: Cache Verilator 5.032
        id: verilator
        uses: actions/cache@v4
        with:
          path: work/verilator
          key: verilator-8ff77e9d47351b0a59114929880687839a51840b-ubuntu-24.04
      - name: Build Verilator 5.032
        if: steps.verilator.outputs.cache-hit != 'true'
        run: bash scripts/build_verilator.sh
      - name: Select Verilator
        run: echo "$PWD/work/verilator/bin" >> "$GITHUB_PATH"
      - name: Check default dependency isolation
        run: |
          cargo tree --locked -p shoop_host -p shoopdaloop -e normal,build > default-tree.txt
          if grep -i marlin default-tree.txt; then exit 1; fi
          python3 scripts/check_dependency_boundaries.py --package shoop_rt_host_fpga_sim --package shoop_host --package shoopdaloop
      - name: Build regular feature-enabled binaries
        run: cargo build --locked -p shoop_host -p shoopdaloop --features fpga-sim
      - name: Check RTL adapter, application replay and storage contracts
        run: cargo test --locked -p shoop_rt_host_fpga_sim --features sim --tests
      - name: Check standalone host, both carriers and cold readiness
        run: cargo test --locked -p shoop_host --features fpga-sim --test fpga_rtl
      - name: Check normal in-process application
        run: cargo test --locked -p shoopdaloop --features fpga-sim fpga_tests::

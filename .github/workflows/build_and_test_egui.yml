name: Build and test

on:
  push:
    branches: ["master"]
    tags: "v*.*.*"
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: egui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

env:
  RUST_BACKTRACE: "1"
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  build_and_test:
    name: ${{ matrix.target }} ${{ matrix.arch }} ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
            arch: x86_64
            profile: debug
            cargo_args: ""
            rust_targets: ""
            binary: target/debug/shoopdaloop_egui
            artifact: shoopdaloop-egui-linux-x86_64-debug.tar.gz
          - target: linux
            os: ubuntu-24.04
            arch: x86_64
            profile: release
            cargo_args: --release
            rust_targets: ""
            binary: target/release/shoopdaloop_egui
            artifact: shoopdaloop-egui-linux-x86_64-release.tar.gz
          - target: windows
            os: windows-2022
            arch: x86_64
            profile: debug
            cargo_args: ""
            rust_targets: x86_64-pc-windows-msvc
            binary: target/debug/shoopdaloop_egui.exe
            artifact: shoopdaloop-egui-windows-x86_64-debug.zip
          - target: windows
            os: windows-2022
            arch: x86_64
            profile: release
            cargo_args: --release
            rust_targets: x86_64-pc-windows-msvc
            binary: target/release/shoopdaloop_egui.exe
            artifact: shoopdaloop-egui-windows-x86_64-release.zip
          - target: macos
            os: macos-15
            arch: arm64
            profile: debug
            cargo_args: ""
            rust_targets: aarch64-apple-darwin
            binary: target/debug/shoopdaloop_egui
            artifact: shoopdaloop-egui-macos-arm64-debug.tar.gz
          - target: macos
            os: macos-15
            arch: arm64
            profile: release
            cargo_args: --release
            rust_targets: aarch64-apple-darwin
            binary: target/release/shoopdaloop_egui
            artifact: shoopdaloop-egui-macos-arm64-release.tar.gz
          - target: web
            os: ubuntu-24.04
            arch: wasm32
            profile: debug
            cargo_args: --no-default-features
            trunk_args: ""
            rust_targets: wasm32-unknown-unknown
            artifact: shoopdaloop-egui-web-wasm32-debug.zip
            html_artifact: shoopdaloop-egui-web-wasm32-debug.html
          - target: web
            os: ubuntu-24.04
            arch: wasm32
            profile: release
            cargo_args: --release --no-default-features
            trunk_args: --release
            rust_targets: wasm32-unknown-unknown
            artifact: shoopdaloop-egui-web-wasm32-release.zip
            html_artifact: shoopdaloop-egui-web-wasm32-release.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        if: env.ACT != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
          components: rustfmt

      - name: Cache Rust builds
        if: env.ACT != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: egui-v1
          shared-key: ${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.profile }}
          cache-targets: "true"
          cache-bin: ${{ matrix.target == 'web' }}

      - name: Check local act prerequisites
        if: env.ACT == 'true'
        run: |
          rustc --version
          cargo --version
          python3 --version
          if [ "${{ matrix.target }}" = "web" ]; then trunk --version; fi

      - name: Install Linux build dependencies
        if: matrix.target == 'linux' && env.ACT != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libjack-jackd2-dev liblilv-dev libgl1-mesa-dev libx11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev libwayland-dev

      - name: Install web build and test dependencies
        if: matrix.target == 'web' && env.ACT != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libjack-jackd2-dev liblilv-dev pulseaudio xvfb
          if ! command -v trunk >/dev/null 2>&1; then
            cargo install --locked trunk --version 0.21.14
          fi
          trunk --version

      - name: Install macOS native FX build dependency
        if: matrix.target == 'macos' && env.ACT != 'true'
        run: brew install lilv pkg-config

      - name: Install Windows native FX build dependency
        if: matrix.target == 'windows' && env.ACT != 'true'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install lilv:x64-windows pkgconf:x64-windows
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          $pkgconf = Get-ChildItem -Path $installed -Filter pkgconf.exe -Recurse | Select-Object -First 1
          if (-not $pkgconf) { throw "vcpkg pkgconf.exe was not installed" }
          "PKG_CONFIG=$($pkgconf.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$installed\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build native application
        if: matrix.target != 'web'
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked -p shoopdaloop_egui ${{ matrix.cargo_args }}

      - name: Build web application
        if: matrix.target == 'web'
        working-directory: src/rust/shoopdaloop_egui
        env:
          RUSTFLAGS: -D warnings
        run: trunk build ${{ matrix.trunk_args }}

      - name: Package native application
        if: matrix.target != 'web'
        run: >-
          python3 src/rust/shoopdaloop_egui/package_artifacts.py native
          --platform ${{ matrix.target }}
          --arch ${{ matrix.arch }}
          --profile ${{ matrix.profile }}
          --binary ${{ matrix.binary }}
          --output-dir artifacts

      - name: Package web application
        if: matrix.target == 'web'
        run: >-
          python3 src/rust/shoopdaloop_egui/package_artifacts.py web
          --profile ${{ matrix.profile }}
          --dist src/rust/shoopdaloop_egui/dist
          --output-dir artifacts

      - name: Upload native application
        if: matrix.target != 'web' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/${{ matrix.artifact }}
          archive: false

      - name: Upload hosted web bundle
        if: matrix.target == 'web' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/${{ matrix.artifact }}
          archive: false

      - name: Upload self-contained web application
        if: matrix.target == 'web' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/${{ matrix.html_artifact }}
          archive: false

      - name: Stage application artifacts for local act
        if: env.ACT == 'true'
        run: |
          test -s "artifacts/${{ matrix.artifact }}"
          if [ "${{ matrix.target }}" = "web" ]; then
            test -s "artifacts/${{ matrix.html_artifact }}"
          fi
          ls -lh artifacts

      # Tests deliberately follow artifact upload so failed tests leave a build to inspect.
      - name: Verify native application archive
        if: matrix.target != 'web'
        run: >-
          python3 src/rust/shoopdaloop_egui/package_artifacts.py verify
          --platform ${{ matrix.target }}
          --artifact artifacts/${{ matrix.artifact }}

      - name: Test native application path
        if: matrix.target != 'web' && (matrix.target != 'linux' || matrix.profile != 'debug')
        env:
          RUSTFLAGS: -D warnings
          SHOOP_ALLOW_MISSING_BACKENDS: 1
        run: >-
          cargo test --locked ${{ matrix.cargo_args }}
          -p shoop_app_api
          -p shoop_engine
          -p shoop_backend
          -p shoop_app
          -p shoop_egui
          -p shoopdaloop_egui
          -- --test-threads=1

      - name: Test complete retained workspace
        if: matrix.target == 'linux' && matrix.profile == 'debug'
        env:
          RUSTFLAGS: -D warnings
          SHOOP_ALLOW_MISSING_BACKENDS: 1
        run: cargo test --locked --workspace --features shoop_engine/app_backend -- --test-threads=1

      - name: Check formatting and tracing inventory
        if: matrix.target == 'linux' && matrix.profile == 'debug'
        run: |
          cargo fmt --all -- --check
          python3 scripts/check_tracing_coverage.py --require-closed

      - name: Verify web application artifacts
        if: matrix.target == 'web'
        run: >-
          python3 src/rust/shoopdaloop_egui/package_artifacts.py verify
          --platform web
          --artifact artifacts/${{ matrix.artifact }}
          --html artifacts/${{ matrix.html_artifact }}

      - name: Test browser-independent web components
        if: matrix.target == 'web'
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo test --locked ${{ matrix.cargo_args }}
          -p shoop_audio_protocol
          -p shoop_audio_worklet
          -p shoop_egui
          -p shoopdaloop_egui

      - name: Check WebAssembly packages
        if: matrix.target == 'web'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked ${{ matrix.cargo_args }} -p shoopdaloop_egui --target wasm32-unknown-unknown
          cargo build --locked ${{ matrix.cargo_args }} -p shoop_audio_worklet --target wasm32-unknown-unknown

      - name: Inspect browser dependency isolation
        if: matrix.target == 'web'
        run: |
          cargo tree -p shoop_audio_worklet --target wasm32-unknown-unknown > /tmp/worklet-tree.txt
          cargo tree -p shoopdaloop_egui --target wasm32-unknown-unknown --no-default-features > /tmp/browser-tree.txt
          if grep -E '(^| )((cpal|midir|jack|lilv|lv2_raw|firewheel) v)' /tmp/worklet-tree.txt; then exit 1; fi
          if grep -E '(^| )((cpal|midir|jack|lilv|lv2_raw|firewheel) v)' /tmp/browser-tree.txt; then exit 1; fi
          node -e "const fs=require('fs'); const m=new WebAssembly.Module(fs.readFileSync('src/rust/shoopdaloop_egui/dist/generated/shoop_audio_worklet.wasm')); if (WebAssembly.Module.imports(m).length) throw new Error('worklet Wasm has imports')"

      - name: Run core hosted Web Audio workflows
        if: matrix.target == 'web' && env.ACT != 'true'
        working-directory: src/rust/shoopdaloop_egui
        run: |
          BROWSER_SIZE=360,200 node --experimental-websocket browser_smoke.mjs
          BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          WEB_MIDI=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          OUTPUT_ONLY=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          SETTINGS_ONLY=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          SETTINGS_ONLY=1 SETTINGS_UNAVAILABLE=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs

      - name: Run self-contained web workflows
        if: matrix.target == 'web' && env.ACT != 'true'
        working-directory: src/rust/shoopdaloop_egui
        env:
          SELF_CONTAINED_PATH: ../../../artifacts/${{ matrix.html_artifact }}
        run: |
          SELF_CONTAINED=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          SELF_CONTAINED=1 WEB_MIDI=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          SELF_CONTAINED=1 OUTPUT_ONLY=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          SELF_CONTAINED=1 DIRECT_FILE_MIC=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          SELF_CONTAINED=1 SETTINGS_ONLY=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs

      - name: Run extended Chrome Web Audio workflows
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        working-directory: src/rust/shoopdaloop_egui
        run: |
          DENY_FIRST=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          WEB_MIDI=1 WEB_MIDI_DENY_FIRST=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          WEB_MIDI=1 WEB_MIDI_OPEN_FAIL=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          LIFECYCLE=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          SATURATE=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs
          STRESS=1 BROWSER_SIZE=900,600 node --experimental-websocket browser_smoke.mjs

      - name: Start virtual Firefox audio output
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=shoop_ci
          pactl set-default-sink shoop_ci
          pactl info

      - name: Install Firefox browser
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        uses: browser-actions/setup-firefox@v1

      - name: Install geckodriver
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Selenium
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        run: python3 -m pip install selenium

      - name: Run Firefox Web Audio workflow
        if: matrix.target == 'web' && matrix.profile == 'release' && env.ACT != 'true'
        working-directory: src/rust/shoopdaloop_egui
        run: xvfb-run -a python3 browser_firefox_smoke.py

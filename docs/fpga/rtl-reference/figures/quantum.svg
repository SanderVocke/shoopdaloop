<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="title desc">
  <title id="title">Quantum boundaries and render handoff</title>
  <desc id="desc">A request for frame 80 waits for the frame 96 sync pass. A playback example shows the render position and next position written to the same RAM record and the resulting ReadView job.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#4b626f"/>
    </marker>
    <marker id="hint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#846022"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="482" rx="16" fill="#fbfcfd" stroke="#ced9e0" stroke-width="2"/>
  <g inkscape:label="Frame timeline">
  <text x="34" y="39" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1b3244">Musical time  /  Q = 32 frames</text>
  <rect x="90" y="97" width="398" height="46" rx="4" fill="#eaf1fb" stroke="#456a9f" stroke-width="1"/>
  <rect x="488" y="97" width="398" height="46" rx="4" fill="#e4f3ed" stroke="#30775f" stroke-width="1"/>
  <text x="289" y="125" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Frames 64–95 use one loop mode</text>
  <text x="687" y="125" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Next quantum</text>
  <line x1="90" y1="82" x2="90" y2="157" stroke="#306887" stroke-width="2"/>
  <text x="90" y="74" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1b3244">64</text>
  <line x1="488" y1="82" x2="488" y2="157" stroke="#306887" stroke-width="2"/>
  <text x="488" y="74" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1b3244">96</text>
  <line x1="886" y1="82" x2="886" y2="157" stroke="#306887" stroke-width="2"/>
  <text x="886" y="74" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#1b3244">128</text>
  <line x1="289" y1="77" x2="289" y2="96" stroke="#996e24" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="289" cy="92" r="4" fill="#996e24"/>
  <text x="289" y="67" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#8c631f">80 requested</text>
  <text x="42" y="179" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">SP checks plans</text>
  <text x="488" y="179" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">Frame 80 becomes eligible</text>
  </g>
  <g inkscape:label="State writes and reads within the earlier quantum">
  <text x="34" y="229" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1b3244">Frame-64 run  /  loop is playing at position 32  /  32-frame chunks</text>
  <rect x="34" y="249" width="266" height="61" rx="7" fill="#eaf1fb" stroke="#456a9f" stroke-width="1"/>
  <text x="46" y="272" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">1  ·  SP sync pass</text>
  <text x="46" y="293" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Updates local loop RAM</text>
  <rect x="348" y="249" width="265" height="61" rx="7" fill="#eaf1fb" stroke="#456a9f" stroke-width="1"/>
  <text x="360" y="272" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">2  ·  SP data pass</text>
  <text x="360" y="293" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Reads the render fields</text>
  <rect x="661" y="249" width="265" height="61" rx="7" fill="#e4f3ed" stroke="#30775f" stroke-width="1"/>
  <text x="673" y="272" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">3  ·  JP execution</text>
  <text x="673" y="293" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Consumes the queued job</text>
  <path d="M 300,279 L 348,279" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 613,279 L 661,279" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="34" y="327" width="266" height="113" rx="6" fill="#fff" stroke="#a9beca" stroke-width="1"/>
  <text x="50" y="351" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Loop RAM writes</text>
  <text x="50" y="376" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">w8  Render position = 32</text>
  <text x="50" y="399" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">w9  Boundary stamp = 64</text>
  <text x="50" y="422" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">w2  Next position = 64</text>
  <rect x="348" y="327" width="265" height="113" rx="6" fill="#e4f3ed" stroke="#30775f" stroke-width="1"/>
  <text x="364" y="351" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">ReadView descriptor</text>
  <text x="364" y="376" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">View ID from node-state RAM</text>
  <text x="364" y="399" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">Position 32 → chunk index 1</text>
  <text x="364" y="422" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">Length and destination</text>
  <rect x="661" y="327" width="265" height="113" rx="6" fill="#fff" stroke="#a9beca" stroke-width="1"/>
  <text x="677" y="351" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Rendered samples</text>
  <text x="677" y="376" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">JP reads the view at chunk 1.</text>
  <text x="677" y="399" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">SP stored the next position.</text>
  <text x="677" y="422" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">JP finishes before the next run.</text>
  </g>
</svg>

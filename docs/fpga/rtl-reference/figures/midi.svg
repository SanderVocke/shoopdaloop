<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 960 535" width="960" height="535" role="img" aria-labelledby="title desc">
  <title id="title">MIDI job order and list data flow</title>
  <desc id="desc">SP settles loop timing, queues writer and optional state transitions, then emits data jobs. JP runs the shared FIFO. Input and Read produce scratch lists in DDR, Merge combines them and Output transfers packets. BRAM stores handles, list descriptors and cursors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#4b626f"/>
    </marker>
    <marker id="hint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#846022"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="533" rx="16" fill="#fbfcfd" stroke="#ced9e0" stroke-width="2"/>
  <g inkscape:label="Ordering on the shared SP and JP">
  <rect x="23" y="20" width="914" height="116" rx="10" fill="#eef4f7" stroke="#bacbd4" stroke-width="1"/>
  <text x="38" y="45" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#395568">SHARED SP AND JP</text>
  <rect x="43" y="58" width="251" height="58" rx="7" fill="#eaf1fb" stroke="#456a9f" stroke-width="1"/>
  <text x="55" y="81" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">1  ·  Loop visit</text>
  <text x="55" y="102" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Settle mode and position</text>
  <rect x="351" y="58" width="251" height="58" rx="7" fill="#eaf1fb" stroke="#456a9f" stroke-width="1"/>
  <text x="363" y="81" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">2  ·  MIDI setup</text>
  <text x="363" y="102" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Writer + state transitions</text>
  <rect x="661" y="58" width="251" height="58" rx="7" fill="#eaf1fb" stroke="#456a9f" stroke-width="1"/>
  <text x="673" y="81" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">3  ·  MIDI data jobs</text>
  <text x="673" y="102" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Queue packets and media work</text>
  <path d="M 294,87 L 351,87" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 602,87 L 661,87" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  </g>
  <g inkscape:label="Example list route">
  <text x="34" y="173" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1b3244">MIDI list routing</text>
  <rect x="38" y="201" width="211" height="61" rx="7" fill="#f0eafd" stroke="#7458a3" stroke-width="1"/>
  <text x="50" y="224" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Input → live list</text>
  <text x="50" y="245" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Copy from staged input</text>
  <rect x="38" y="283" width="211" height="61" rx="7" fill="#f0eafd" stroke="#7458a3" stroke-width="1"/>
  <text x="50" y="306" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Read playback</text>
  <text x="50" y="327" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Fetch from the stored take</text>
  <rect x="314" y="244" width="179" height="61" rx="7" fill="#f0eafd" stroke="#7458a3" stroke-width="1"/>
  <text x="326" y="267" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Merge lists</text>
  <text x="326" y="288" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Offset, source, order</text>
  <rect x="552" y="244" width="155" height="61" rx="7" fill="#f0eafd" stroke="#7458a3" stroke-width="1"/>
  <text x="564" y="267" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Output</text>
  <text x="564" y="288" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Send sorted list</text>
  <rect x="763" y="244" width="159" height="61" rx="7" fill="#f2f5f7" stroke="#647b87" stroke-width="1"/>
  <text x="775" y="267" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1b3244">Receiver</text>
  <text x="775" y="288" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#1b3244">Ready / valid</text>
  <path d="M 249,231 L 275,231 L 275,263 L 314,263" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 249,312 L 275,312 L 275,285 L 314,285" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 493,273 L 552,273" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 707,273 L 763,273" fill="none" stroke="#4b626f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="39" y="376" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">The lists hold timestamps and message bytes. SP keeps the loop mode and position.</text>
  </g>
  <g inkscape:label="Memory placement">
  <rect x="24" y="404" width="446" height="108" rx="10" fill="#fff2d9" stroke="#bacbd4" stroke-width="1"/>
  <text x="39" y="429" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#395568">MIDI DDR  /  WORD AXI</text>
  <text x="39" y="456" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">Retained views, block tables and event blocks</text>
  <text x="39" y="481" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">Shared scratch payloads for Input, Read and Merge</text>
  <rect x="491" y="404" width="446" height="108" rx="10" fill="#f0eafd" stroke="#bacbd4" stroke-width="1"/>
  <text x="506" y="429" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#395568">ON-CHIP BRAM</text>
  <text x="507" y="456" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">Sequence handles and list start/count descriptors</text>
  <text x="507" y="481" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#435d6d">Reader index and one future event per cursor</text>
  </g>
</svg>
